<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-cctv" role="img" aria-label="CCTV">
<defs><linearGradient id="antz-l-cctv-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-cctv .i,.antz-l-cctv .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-cctv .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-cctv .a{stroke:url(#antz-l-cctv-acc)}
.antz-l-cctv .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-cctv .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-cctv .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-cctv-0{stroke-dasharray:1;animation:antz-l-cctv-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-cctv-1{transform-box:view-box;transform-origin:27px 24px;animation:antz-l-cctv-1 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-cctv-2{animation:antz-l-cctv-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-cctv-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-cctv-1{0%,30%{transform:rotate(-10deg);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@keyframes antz-l-cctv-2{0%,34.8%{transform:scale(0);opacity:0}35.8%{opacity:1}46.8%,100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-cctv *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
