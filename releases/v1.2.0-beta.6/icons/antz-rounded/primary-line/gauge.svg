<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-gauge" role="img" aria-label="KPI gauge">
<defs><linearGradient id="antz-l-gauge-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-gauge .i,.antz-l-gauge .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-gauge .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-gauge .a{stroke:url(#antz-l-gauge-acc)}
.antz-l-gauge .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-gauge .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-gauge .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-gauge-0{stroke-dasharray:1;animation:antz-l-gauge-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-gauge-1{stroke-dasharray:1;animation:antz-l-gauge-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-gauge-2{transform-box:view-box;transform-origin:24px 32px;animation:antz-l-gauge-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-gauge-3{animation:antz-l-gauge-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-gauge-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-gauge-1{0%,7.2%{stroke-dashoffset:1}28.2%,100%{stroke-dashoffset:0}}
@keyframes antz-l-gauge-2{0%,30%{transform:rotate(-90deg);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@keyframes antz-l-gauge-3{0%,32.4%{transform:scale(0);opacity:0}33.4%{opacity:1}44.4%,100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-gauge *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-gauge-0" d="M8 32a16 16 0 0 1 32 0" pathLength="1"/>
<path class="i antz-l-gauge-1" d="M36 32L37.4 32M12 32L10.6 32M13.6 26L12.4 25.3M18 21.6L17.3 20.4M24 20L24 18.6M30 21.6L30.7 20.4M34.4 26L35.6 25.3" pathLength="1"/>
<path class="a antz-l-gauge-2" d="M24 32l6.5-6.5"/>
<circle class="a antz-l-gauge-3" cx="24" cy="32" r="1.5"/>
</svg>
