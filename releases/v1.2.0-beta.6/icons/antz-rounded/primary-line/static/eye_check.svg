<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-eye_check" role="img" aria-label="Eye check">
<defs><linearGradient id="antz-l-eye_check-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-eye_check .i,.antz-l-eye_check .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-eye_check .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-eye_check .a{stroke:url(#antz-l-eye_check-acc)}
.antz-l-eye_check .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-eye_check .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-eye_check .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
</style>
<path class="i antz-l-eye_check-0" d="M5 24s7-12 19-12 19 12 19 12-7 12-19 12S5 24 5 24Z" pathLength="1"/>
<circle class="i antz-l-eye_check-1" cx="24" cy="24" r="1.4"/>
<circle class="a antz-l-eye_check-2" cx="24" cy="24" r="5.5"/>
</svg>
