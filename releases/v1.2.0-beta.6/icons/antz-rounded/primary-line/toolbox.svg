<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-toolbox" role="img" aria-label="Tools">
<defs><linearGradient id="antz-l-toolbox-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient><mask id="antz-l-toolbox-cut" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><rect class="k antz-l-toolbox-3" x="20.5" y="23.5" width="7" height="7" rx="1.5" fill="#000"/></mask></defs>
<style>
.antz-l-toolbox .i,.antz-l-toolbox .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-toolbox .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-toolbox .a{stroke:url(#antz-l-toolbox-acc)}
.antz-l-toolbox .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-toolbox .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-toolbox .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-toolbox-0{stroke-dasharray:1;animation:antz-l-toolbox-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-toolbox-1{stroke-dasharray:1;animation:antz-l-toolbox-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-toolbox-2{stroke-dasharray:1;animation:antz-l-toolbox-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-toolbox-3{animation:antz-l-toolbox-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-toolbox-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-toolbox-1{0%,5.4%{stroke-dashoffset:1}26.4%,100%{stroke-dashoffset:0}}
@keyframes antz-l-toolbox-2{0%,9%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
@keyframes antz-l-toolbox-3{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-toolbox *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g mask="url(#antz-l-toolbox-cut)">
<rect class="i antz-l-toolbox-0" x="6" y="18" width="36" height="22" rx="3" pathLength="1"/>
<path class="i antz-l-toolbox-1" d="M18 18v-4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v4" pathLength="1"/>
<path class="i antz-l-toolbox-2" d="M6 27h36" pathLength="1"/>
</g>
<rect class="a antz-l-toolbox-3" x="20.5" y="23.5" width="7" height="7" rx="1.5"/>
</svg>
