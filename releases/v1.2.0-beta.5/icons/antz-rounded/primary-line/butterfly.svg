<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-butterfly" role="img" aria-label="Butterfly">
<defs><linearGradient id="antz-l-butterfly-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-butterfly .i,.antz-l-butterfly .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-butterfly .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-butterfly .a{stroke:url(#antz-l-butterfly-acc)}
.antz-l-butterfly .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-butterfly .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-butterfly .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-butterfly-0{stroke-dasharray:1;animation:antz-l-butterfly-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-butterfly-1{stroke-dasharray:1;animation:antz-l-butterfly-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-butterfly-2{transform-box:view-box;transform-origin:24px 24px;animation:antz-l-butterfly-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-butterfly-3{transform-box:view-box;transform-origin:24px 24px;animation:antz-l-butterfly-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-butterfly-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-butterfly-1{0%,7.2%{stroke-dashoffset:1}28.2%,100%{stroke-dashoffset:0}}
@keyframes antz-l-butterfly-2{0%,30%{transform:scaleX(.35);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@keyframes antz-l-butterfly-3{0%,30%{transform:scaleX(.35);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-butterfly *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-butterfly-0" d="M24 16v20" pathLength="1"/>
<path class="i antz-l-butterfly-1" d="M24 16c-1-4-3-6-5-7M24 16c1-4 3-6 5-7" pathLength="1"/>
<path class="a antz-l-butterfly-2" d="M21 19c-5-7-14-8-15-2-.8 5 6 9 15 7M21 27c-7 0-12 3.5-11 8 1 4.5 8 3 11-3"/>
<path class="a antz-l-butterfly-3" d="M27 19c5-7 14-8 15-2 .8 5-6 9-15 7M27 27c7 0 12 3.5 11 8-1 4.5-8 3-11-3"/>
</svg>
