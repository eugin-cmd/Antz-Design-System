<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-thermometer" role="img" aria-label="Temperature">
<defs><linearGradient id="antz-l-thermometer-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-thermometer .i,.antz-l-thermometer .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-thermometer .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-thermometer .a{stroke:url(#antz-l-thermometer-acc)}
.antz-l-thermometer .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-thermometer .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-thermometer .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-thermometer-0{stroke-dasharray:1;animation:antz-l-thermometer-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-thermometer-1{stroke-dasharray:1;animation:antz-l-thermometer-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-thermometer-2{animation:antz-l-thermometer-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-thermometer-3{transform-box:view-box;transform-origin:24px 31px;animation:antz-l-thermometer-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-thermometer-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-thermometer-1{0%,10.8%{stroke-dashoffset:1}31.8%,100%{stroke-dashoffset:0}}
@keyframes antz-l-thermometer-2{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,100%{transform:scale(1);opacity:1}}
@keyframes antz-l-thermometer-3{0%,33.6%{transform:scaleY(0);opacity:0}35.1%{opacity:1}49.6%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-thermometer *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-thermometer-0" d="M20 28V10a4 4 0 0 1 8 0v18a8 8 0 1 1-8 0Z" pathLength="1"/>
<path class="i antz-l-thermometer-1" d="M32 12h3M32 17h3M32 22h3" pathLength="1"/>
<circle class="a antz-l-thermometer-2" cx="24" cy="34" r="3"/>
<path class="a antz-l-thermometer-3" d="M24 31V16"/>
</svg>
