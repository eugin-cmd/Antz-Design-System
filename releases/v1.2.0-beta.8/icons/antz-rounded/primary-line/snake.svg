<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-snake" role="img" aria-label="Snake">
<defs><linearGradient id="antz-l-snake-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-snake .i,.antz-l-snake .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-snake .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-snake .a{stroke:url(#antz-l-snake-acc)}
.antz-l-snake .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-snake .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-snake .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-snake-0{stroke-dasharray:1;animation:antz-l-snake-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-snake-1{stroke-dasharray:1;animation:antz-l-snake-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-snake-2{transform-box:view-box;transform-origin:32.6px 8px;animation:antz-l-snake-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-snake-3{animation:antz-l-snake-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-snake-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-snake-1{0%,3.6%{stroke-dashoffset:1}24.6%,100%{stroke-dashoffset:0}}
@keyframes antz-l-snake-2{0%,30%{transform:scaleX(0);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@keyframes antz-l-snake-3{0%,33.6%{transform:scale(0);opacity:0}34.6%{opacity:1}45.6%,100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-snake *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<circle class="i antz-l-snake-0" cx="36" cy="9" r="3.5" pathLength="1"/>
<path class="i antz-l-snake-1" d="M37.8 12c0 4-3 7-7 7H17a6 6 0 0 0 0 12h14a5 5 0 0 1 0 10H10" pathLength="1"/>
<path class="a antz-l-snake-2" d="M32.6 8 29.5 6.5M29.5 6.5 28 5M29.5 6.5l-2 .6"/>
<circle class="a antz-l-snake-3" cx="36.5" cy="8.2" r="0.8"/>
</svg>
