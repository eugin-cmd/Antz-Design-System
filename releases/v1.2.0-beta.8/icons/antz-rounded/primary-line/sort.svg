<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-sort" role="img" aria-label="Sort">
<defs><linearGradient id="antz-l-sort-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-sort .i,.antz-l-sort .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-sort .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-sort .a{stroke:url(#antz-l-sort-acc)}
.antz-l-sort .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-sort .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-sort .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-sort-0{stroke-dasharray:1;animation:antz-l-sort-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-sort-1{animation:antz-l-sort-1 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-sort-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-sort-1{0%,30%{transform:translateY(7px);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-sort *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-sort-0" d="M16 8v32M10 34l6 6 6-6" pathLength="1"/>
<path class="a antz-l-sort-1" d="M32 40V8M26 14l6-6 6 6"/>
</svg>
