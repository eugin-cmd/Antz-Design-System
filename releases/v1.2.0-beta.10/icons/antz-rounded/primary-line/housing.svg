.antz-l-housing-0{stroke-dasharray:1;animation:antz-l-housing-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-housing-1{stroke-dasharray:1;animation:antz-l-housing-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-housing-2{stroke-dasharray:1;animation:antz-l-housing-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-housing-3{stroke-dasharray:1;animation:antz-l-housing-3 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-housing-4{animation:antz-l-housing-4 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-housing-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-housing-1{0%,4.5%{stroke-dashoffset:1}25.5%,100%{stroke-dashoffset:0}}
@keyframes antz-l-housing-2{0%,9.9%{stroke-dashoffset:1}30.9%,100%{stroke-dashoffset:0}}
@keyframes antz-l-housing-3{0%,30%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
@keyframes antz-l-housing-4{0%,36%{transform:scale(0);opacity:0}37%{opacity:1}48%,100%{transform:scale(1);opacity:1}}
