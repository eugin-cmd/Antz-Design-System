<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-housing" role="img" aria-label="Housing">
<defs><linearGradient id="antz-l-housing-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient><mask id="antz-l-housing-cut" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path class="k antz-l-housing-3" d="M18 40V28a6 6 0 0 1 12 0v12" pathLength="1" fill="none"/><circle class="k antz-l-housing-4" cx="26.5" cy="34" r="1" fill="#000"/></mask></defs>
<style>
.antz-l-housing .i,.antz-l-housing .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
