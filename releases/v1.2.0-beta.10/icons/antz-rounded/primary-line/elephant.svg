<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-elephant" role="img" aria-label="Elephant">
<defs><linearGradient id="antz-l-elephant-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-elephant .i,.antz-l-elephant .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-elephant .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-elephant .a{stroke:url(#antz-l-elephant-acc)}
.antz-l-elephant .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-elephant .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-elephant .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-elephant-0{stroke-dasharray:1;animation:antz-l-elephant-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-elephant-1{animation:antz-l-elephant-1 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-elephant-2{animation:antz-l-elephant-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-elephant-3{transform-box:view-box;transform-origin:15.3px 20px;animation:antz-l-elephant-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-elephant-4{transform-box:view-box;transform-origin:32.7px 20px;animation:antz-l-elephant-4 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-elephant-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-elephant-1{0%,10.8%{transform:scale(0);opacity:0}11.8%{opacity:1}22.8%,100%{transform:scale(1);opacity:1}}
@keyframes antz-l-elephant-2{0%,12.6%{transform:scale(0);opacity:0}13.6%{opacity:1}24.6%,100%{transform:scale(1);opacity:1}}
@keyframes antz-l-elephant-3{0%,30%{transform:rotate(-16deg);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@keyframes antz-l-elephant-4{0%,31.2%{transform:rotate(16deg);opacity:0}32.7%{opacity:1}47.2%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-elephant *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-elephant-0" d="M20 38v-4c0-3-1-5-3-7a10 10 0 1 1 14 0c-2 2-3 4-3 7v4a4 4 0 0 1-8 0" pathLength="1"/>
<circle class="i antz-l-elephant-1" cx="20.5" cy="19" r="1"/>
<circle class="i antz-l-elephant-2" cx="27.5" cy="19" r="1"/>
<path class="a antz-l-elephant-3" d="M15.3 15c-5-3-10-1-10 5s4 8 10 5"/>
<path class="a antz-l-elephant-4" d="M32.7 15c5-3 10-1 10 5s-4 8-10 5"/>
</svg>
