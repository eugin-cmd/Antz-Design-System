<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-bird" role="img" aria-label="Bird">
<defs><linearGradient id="antz-l-bird-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-bird .i,.antz-l-bird .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-bird .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-bird .a{stroke:url(#antz-l-bird-acc)}
.antz-l-bird .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-bird .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-bird .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-bird-0{stroke-dasharray:1;animation:antz-l-bird-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-bird-1{stroke-dasharray:1;animation:antz-l-bird-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-bird-2{stroke-dasharray:1;animation:antz-l-bird-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-bird-3{stroke-dasharray:1;animation:antz-l-bird-3 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-bird-4{transform-box:view-box;transform-origin:17px 30px;animation:antz-l-bird-4 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-bird-5{animation:antz-l-bird-5 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-bird-g{transform-origin:24px 24px;animation:antz-l-bird-g 2800ms cubic-bezier(0.65, 0, 0.35, 1) both}
@keyframes antz-l-bird-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-bird-1{0%,3.6%{stroke-dashoffset:1}24.6%,100%{stroke-dashoffset:0}}
@keyframes antz-l-bird-2{0%,5.4%{stroke-dashoffset:1}26.4%,100%{stroke-dashoffset:0}}
@keyframes antz-l-bird-3{0%,10.8%{stroke-dashoffset:1}31.8%,100%{stroke-dashoffset:0}}
@keyframes antz-l-bird-4{0%,30%{transform:rotate(-18deg);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@keyframes antz-l-bird-5{0%,34.8%{transform:scale(0);opacity:0}35.8%{opacity:1}46.8%,100%{transform:scale(1);opacity:1}}
@keyframes antz-l-bird-g{0%,52%{transform:translateY(0)}57%{transform:translateY(-5px)}63%{transform:translateY(0)}67%{transform:translateY(-2px)}71%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.antz-l-bird *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-bird-g">
<circle class="i antz-l-bird-0" cx="30" cy="15" r="6" pathLength="1"/>
<path class="i antz-l-bird-1" d="M35.7 13.2 41 15l-5.3 2" pathLength="1"/>
<path class="i antz-l-bird-2" d="M27 20.2C19 21 13 27 11 35h14c6 0 10-4.5 10-10.5 0-2-.7-3.4-2-4.3" pathLength="1"/>
<path class="i antz-l-bird-3" d="M11 35l-5 4M20 35v6M26 35v6" pathLength="1"/>
<path class="a antz-l-bird-4" d="M17 30c3-4 7-6 11-6"/>
<circle class="a antz-l-bird-5" cx="31" cy="14" r="1"/>
</g>
</svg>
