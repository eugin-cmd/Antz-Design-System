<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-vaccine" role="img" aria-label="Vaccine">
<defs><linearGradient id="antz-l-vaccine-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-vaccine .i,.antz-l-vaccine .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-vaccine .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-vaccine .a{stroke:url(#antz-l-vaccine-acc)}
.antz-l-vaccine .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-vaccine .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-vaccine .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-vaccine-0{stroke-dasharray:1;animation:antz-l-vaccine-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-vaccine-1{stroke-dasharray:1;animation:antz-l-vaccine-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-vaccine-2{stroke-dasharray:1;animation:antz-l-vaccine-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-vaccine-3{animation:antz-l-vaccine-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-vaccine-4{transform-box:view-box;transform-origin:25px 32px;animation:antz-l-vaccine-4 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-vaccine-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-vaccine-1{0%,9%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
@keyframes antz-l-vaccine-2{0%,12.6%{stroke-dashoffset:1}33.6%,100%{stroke-dashoffset:0}}
@keyframes antz-l-vaccine-3{0%,30%{transform:translateY(-5px);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@keyframes antz-l-vaccine-4{0%,33.6%{transform:scaleY(0);opacity:0}35.1%{opacity:1}49.6%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-vaccine *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<rect class="i antz-l-vaccine-0" x="18" y="13" width="12" height="22" rx="2" pathLength="1"/>
<path class="i antz-l-vaccine-1" d="M24 35v7" pathLength="1"/>
<path class="i antz-l-vaccine-2" d="M18 19h3M18 24h3M18 29h3" pathLength="1"/>
<path class="a antz-l-vaccine-3" d="M19 6h10M24 6v7"/>
<path class="a antz-l-vaccine-4" d="M25 24v8"/>
</svg>
