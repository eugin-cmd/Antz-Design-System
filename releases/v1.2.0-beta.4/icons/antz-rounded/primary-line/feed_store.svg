<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-feed_store" role="img" aria-label="Feed store">
<defs><linearGradient id="antz-l-feed_store-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-feed_store .i,.antz-l-feed_store .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-feed_store .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-feed_store .a{stroke:url(#antz-l-feed_store-acc)}
.antz-l-feed_store .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-feed_store .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-feed_store .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-feed_store-0{stroke-dasharray:1;animation:antz-l-feed_store-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-feed_store-1{stroke-dasharray:1;animation:antz-l-feed_store-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-feed_store-2{stroke-dasharray:1;animation:antz-l-feed_store-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-feed_store-3{stroke-dasharray:1;animation:antz-l-feed_store-3 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-feed_store-g{transform-origin:24px 24px;animation:antz-l-feed_store-g 2800ms cubic-bezier(0.65, 0, 0.35, 1) both}
@keyframes antz-l-feed_store-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-feed_store-1{0%,7.2%{stroke-dashoffset:1}28.2%,100%{stroke-dashoffset:0}}
@keyframes antz-l-feed_store-2{0%,30%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
@keyframes antz-l-feed_store-3{0%,34.8%{stroke-dashoffset:1}48.8%,100%{stroke-dashoffset:0}}
@keyframes antz-l-feed_store-g{0%,52%{transform:translateY(0)}57%{transform:translateY(-5px)}63%{transform:translateY(0)}67%{transform:translateY(-2px)}71%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.antz-l-feed_store *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
