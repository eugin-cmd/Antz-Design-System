<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-move_animal" role="img" aria-label="Move animal">
<defs><linearGradient id="antz-l-move_animal-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-move_animal .i,.antz-l-move_animal .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-move_animal .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-move_animal .a{stroke:url(#antz-l-move_animal-acc)}
.antz-l-move_animal .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-move_animal .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-move_animal .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-move_animal-0{stroke-dasharray:1;animation:antz-l-move_animal-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-move_animal-1{stroke-dasharray:1;animation:antz-l-move_animal-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-move_animal-2{stroke-dasharray:1;animation:antz-l-move_animal-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-move_animal-3{animation:antz-l-move_animal-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-move_animal-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-move_animal-1{0%,5.4%{stroke-dashoffset:1}26.4%,100%{stroke-dashoffset:0}}
@keyframes antz-l-move_animal-2{0%,10.8%{stroke-dashoffset:1}31.8%,100%{stroke-dashoffset:0}}
@keyframes antz-l-move_animal-3{0%,30%{transform:translateX(-7px);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-move_animal *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
