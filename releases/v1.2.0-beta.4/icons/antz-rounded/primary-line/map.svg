<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-map" role="img" aria-label="Map">
<defs><linearGradient id="antz-l-map-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient><mask id="antz-l-map-cut" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path class="k antz-l-map-2" d="M24 31s-6.5-5.5-6.5-10.5a6.5 6.5 0 0 1 13 0C30.5 25.5 24 31 24 31Z" fill="#000"/><circle class="k antz-l-map-3" cx="24" cy="20.5" r="2" fill="#000"/></mask></defs>
<style>
.antz-l-map .i,.antz-l-map .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-map .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-map .a{stroke:url(#antz-l-map-acc)}
.antz-l-map .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-map .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-map .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-map-0{stroke-dasharray:1;animation:antz-l-map-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-map-1{stroke-dasharray:1;animation:antz-l-map-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-map-2{animation:antz-l-map-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-map-3{animation:antz-l-map-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-map-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-map-1{0%,7.2%{stroke-dashoffset:1}28.2%,100%{stroke-dashoffset:0}}
@keyframes antz-l-map-2{0%,30%{transform:translateY(-6px);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@keyframes antz-l-map-3{0%,34.8%{transform:scale(0);opacity:0}35.8%{opacity:1}46.8%,100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-map *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
