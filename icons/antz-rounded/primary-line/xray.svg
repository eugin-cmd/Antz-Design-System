@keyframes antz-l-xray-3{0%,34.8%{stroke-dashoffset:1}48.8%,100%{stroke-dashoffset:0}}
@keyframes antz-l-xray-4{0%,37.2%{stroke-dashoffset:1}51.2%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.antz-l-xray *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
