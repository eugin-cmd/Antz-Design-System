<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-xray" role="img" aria-label="X-ray">
<defs><linearGradient id="antz-l-xray-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-xray .i,.antz-l-xray .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-xray .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-xray .a{stroke:url(#antz-l-xray-acc)}
.antz-l-xray .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
