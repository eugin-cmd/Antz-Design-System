.antz-l-xray-0{stroke-dasharray:1;animation:antz-l-xray-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-xray-1{stroke-dasharray:1;animation:antz-l-xray-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-xray-2{stroke-dasharray:1;animation:antz-l-xray-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-xray-3{stroke-dasharray:1;animation:antz-l-xray-3 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-xray-4{stroke-dasharray:1;animation:antz-l-xray-4 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes antz-l-xray-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-xray-1{0%,30%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
