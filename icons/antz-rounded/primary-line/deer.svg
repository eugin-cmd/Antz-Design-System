.antz-l-deer-1{stroke-dasharray:1;animation:antz-l-deer-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-deer-2{animation:antz-l-deer-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-deer-3{animation:antz-l-deer-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-deer-4{stroke-dasharray:1;animation:antz-l-deer-4 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-deer-5{animation:antz-l-deer-5 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-deer-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-deer-1{0%,6.3%{stroke-dashoffset:1}27.3%,100%{stroke-dashoffset:0}}
