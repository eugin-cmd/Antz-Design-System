<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-rabbit" role="img" aria-label="Rabbit">
<defs><linearGradient id="antz-l-rabbit-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-rabbit .i,.antz-l-rabbit .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-rabbit .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-rabbit .a{stroke:url(#antz-l-rabbit-acc)}
.antz-l-rabbit .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-rabbit .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-rabbit .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
