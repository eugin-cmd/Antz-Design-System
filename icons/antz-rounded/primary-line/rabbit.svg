@keyframes antz-l-rabbit-4{0%,30%{transform:rotate(-12deg);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-rabbit-5{0%,31.8%{transform:rotate(12deg);opacity:0}33.3%{opacity:1}47.8%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
