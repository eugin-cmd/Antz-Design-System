.antz-l-rabbit-3{stroke-dasharray:1;animation:antz-l-rabbit-3 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-rabbit-4{transform-box:view-box;transform-origin:20.5px 20px;animation:antz-l-rabbit-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-rabbit-5{transform-box:view-box;transform-origin:27.5px 20px;animation:antz-l-rabbit-5 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
