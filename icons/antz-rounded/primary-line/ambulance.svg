<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-ambulance" role="img" aria-label="Ambulance">
<defs><linearGradient id="antz-l-ambulance-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient><mask id="antz-l-ambulance-cut" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><circle class="k antz-l-ambulance-1" cx="13" cy="35" r="4" pathLength="1" fill="#000"/><circle class="k antz-l-ambulance-2" cx="34" cy="35" r="4" pathLength="1" fill="#000"/></mask></defs>
<style>
.antz-l-ambulance .i,.antz-l-ambulance .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-ambulance .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-ambulance .a{stroke:url(#antz-l-ambulance-acc)}
.antz-l-ambulance .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-ambulance .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-ambulance .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-ambulance-0{stroke-dasharray:1;animation:antz-l-ambulance-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-ambulance-1{stroke-dasharray:1;animation:antz-l-ambulance-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-ambulance-2{stroke-dasharray:1;animation:antz-l-ambulance-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-ambulance-3{stroke-dasharray:1;animation:antz-l-ambulance-3 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-ambulance-g{transform-origin:24px 24px;animation:antz-l-ambulance-g 2800ms cubic-bezier(0.65, 0, 0.35, 1) both}
@keyframes antz-l-ambulance-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-ambulance-1{0%,9%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
@keyframes antz-l-ambulance-2{0%,10.8%{stroke-dashoffset:1}31.8%,100%{stroke-dashoffset:0}}
@keyframes antz-l-ambulance-3{0%,30%{stroke-dashoffset:1;transform:scale(1)}44%{stroke-dashoffset:0;transform:scale(1)}52%{transform:scale(1.18)}64%,100%{stroke-dashoffset:0;transform:scale(1)}}
@keyframes antz-l-ambulance-g{0%,52%{transform:translateY(0)}57%{transform:translateY(-5px)}63%{transform:translateY(0)}67%{transform:translateY(-2px)}71%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.antz-l-ambulance *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-ambulance-g">
<g mask="url(#antz-l-ambulance-cut)">
<path class="i antz-l-ambulance-0" d="M27 34H7a2 2 0 0 1-2-2V12a2 2 0 0 1 2-2h18a2 2 0 0 1 2 2v22h14v-9l-6-7h-8" pathLength="1"/>
<path class="a antz-l-ambulance-3" d="M16 15v10M11 20h10" pathLength="1"/>
</g>
<circle class="i antz-l-ambulance-1" cx="13" cy="35" r="4" pathLength="1"/>
<circle class="i antz-l-ambulance-2" cx="34" cy="35" r="4" pathLength="1"/>
</g>
</svg>
