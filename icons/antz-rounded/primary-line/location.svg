<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-location" role="img" aria-label="Location">
<defs><linearGradient id="antz-l-location-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-location .i,.antz-l-location .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-location .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-location .a{stroke:url(#antz-l-location-acc)}
.antz-l-location .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-location .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-location .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-location-0{stroke-dasharray:1;animation:antz-l-location-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-location-1{animation:antz-l-location-1 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-location-g{transform-origin:24px 24px;animation:antz-l-location-g 2800ms cubic-bezier(0.65, 0, 0.35, 1) both}
@keyframes antz-l-location-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-location-1{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,100%{transform:scale(1);opacity:1}}
@keyframes antz-l-location-g{0%,52%{transform:translateY(0)}57%{transform:translateY(-5px)}63%{transform:translateY(0)}67%{transform:translateY(-2px)}71%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.antz-l-location *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-location-g">
<path class="i antz-l-location-0" d="M24 42s-13-11.5-13-21a13 13 0 0 1 26 0c0 9.5-13 21-13 21Z" pathLength="1"/>
<circle class="a antz-l-location-1" cx="24" cy="21" r="4.5"/>
</g>
</svg>
