<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-settings" role="img" aria-label="Settings">
<defs><linearGradient id="antz-l-settings-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-settings .i,.antz-l-settings .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-settings .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-settings .a{stroke:url(#antz-l-settings-acc)}
.antz-l-settings .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-settings .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-settings-0{stroke-dasharray:1;animation:antz-l-settings-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-settings-1{animation:antz-l-settings-1 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-settings-g{transform-origin:24px 24px;animation:antz-l-settings-g 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-settings-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-settings-1{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-settings-g{0%,50%{transform:rotate(0)}66%,100%{transform:rotate(180deg)}}
@media (prefers-reduced-motion:reduce){.antz-l-settings *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-settings-g">
<path class="i antz-l-settings-0" d="M36.6 20.9L40.8 21.5L40.8 26.5L36.6 27.1L35.1 30.7L37.7 34.1L34.1 37.7L30.7 35.1L27.1 36.6L26.5 40.8L21.5 40.8L20.9 36.6L17.3 35.1L13.9 37.7L10.3 34.1L12.9 30.7L11.4 27.1L7.2 26.5L7.2 21.5L11.4 20.9L12.9 17.3L10.3 13.9L13.9 10.3L17.3 12.9L20.9 11.4L21.5 7.2L26.5 7.2L27.1 11.4L30.7 12.9L34.1 10.3L37.7 13.9L35.1 17.3Z" pathLength="1"/>
<circle class="a antz-l-settings-1" cx="24" cy="24" r="5.5"/>
</g>
</svg>
