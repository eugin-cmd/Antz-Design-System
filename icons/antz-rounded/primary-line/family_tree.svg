.antz-l-family_tree-3{stroke-dasharray:1;animation:antz-l-family_tree-3 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-family_tree-4{animation:antz-l-family_tree-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-family_tree-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
