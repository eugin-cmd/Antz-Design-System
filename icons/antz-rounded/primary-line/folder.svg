<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-folder" role="img" aria-label="Folder">
<defs><linearGradient id="antz-l-folder-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-folder .i,.antz-l-folder .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-folder .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-folder .a{stroke:url(#antz-l-folder-acc)}
.antz-l-folder .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-folder .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-folder .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-folder-0{stroke-dasharray:1;animation:antz-l-folder-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-folder-1{stroke-dasharray:1;animation:antz-l-folder-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-folder-2{stroke-dasharray:1;animation:antz-l-folder-2 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes antz-l-folder-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-folder-1{0%,30%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
@keyframes antz-l-folder-2{0%,34.8%{stroke-dashoffset:1}48.8%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.antz-l-folder *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-folder-0" d="M6 14a3 3 0 0 1 3-3h9l4 4h17a3 3 0 0 1 3 3v19a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3Z" pathLength="1"/>
<path class="a antz-l-folder-1" d="M13 24h22" pathLength="1"/>
<path class="a antz-l-folder-2" d="M13 31h13" pathLength="1"/>
</svg>
