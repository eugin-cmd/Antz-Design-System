<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-trend_up" role="img" aria-label="Trending up">
<defs><linearGradient id="antz-l-trend_up-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-trend_up .i,.antz-l-trend_up .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-trend_up .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-trend_up .a{stroke:url(#antz-l-trend_up-acc)}
.antz-l-trend_up .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-trend_up .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-trend_up .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-trend_up-0{stroke-dasharray:1;animation:antz-l-trend_up-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-trend_up-1{stroke-dasharray:1;animation:antz-l-trend_up-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
@keyframes antz-l-trend_up-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-trend_up-1{0%,30%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.antz-l-trend_up *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-trend_up-0" d="M6 42h36" pathLength="1"/>
<path class="a antz-l-trend_up-1" d="M6 34l12-12 7 7 15-15M31 14h9v9" pathLength="1"/>
</svg>
