<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-necropsy" role="img" aria-label="Necropsy">
<defs><linearGradient id="antz-l-necropsy-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-necropsy .i,.antz-l-necropsy .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-necropsy .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-necropsy .a{stroke:url(#antz-l-necropsy-acc)}
.antz-l-necropsy .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-necropsy .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-necropsy-0{stroke-dasharray:1;animation:antz-l-necropsy-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-necropsy-1{stroke-dasharray:1;animation:antz-l-necropsy-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-necropsy-2{stroke-dasharray:1;animation:antz-l-necropsy-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-necropsy-3{transform-box:view-box;transform-origin:31px 31px;animation:antz-l-necropsy-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-necropsy-4{animation:antz-l-necropsy-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-necropsy-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-necropsy-1{0%,4.5%{stroke-dashoffset:1}25.5%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-necropsy-2{0%,9%{stroke-dashoffset:1}30%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-necropsy-3{0%,30%{transform:translate(-5px,-5px);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-necropsy-4{0%,31.2%{transform:translate(-5px,-5px);opacity:0}32.7%{opacity:1}47.2%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-necropsy *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<rect class="i antz-l-necropsy-0" x="8" y="9" width="24" height="32" rx="3" pathLength="1"/>
<path class="i antz-l-necropsy-1" d="M15 9V7a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v2" pathLength="1"/>
<path class="i antz-l-necropsy-2" d="M13 18h14M13 23h10M13 28h6" pathLength="1"/>
<circle class="a antz-l-necropsy-3" cx="31" cy="31" r="6"/>
<path class="a antz-l-necropsy-4" d="M35.5 35.5 41 41"/>
</svg>
