<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-dashboard" role="img" aria-label="Dashboard">
<defs><linearGradient id="antz-l-dashboard-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-dashboard .i,.antz-l-dashboard .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-dashboard .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-dashboard .a{stroke:url(#antz-l-dashboard-acc)}
.antz-l-dashboard .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-dashboard .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-dashboard .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-dashboard-0{stroke-dasharray:1;animation:antz-l-dashboard-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-dashboard-1{stroke-dasharray:1;animation:antz-l-dashboard-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-dashboard-2{stroke-dasharray:1;animation:antz-l-dashboard-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-dashboard-3{stroke-dasharray:1;animation:antz-l-dashboard-3 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-dashboard-4{stroke-dasharray:1;animation:antz-l-dashboard-4 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-dashboard-5{animation:antz-l-dashboard-5 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-dashboard-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-dashboard-1{0%,3.6%{stroke-dashoffset:1}24.6%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-dashboard-2{0%,7.2%{stroke-dashoffset:1}28.2%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-dashboard-3{0%,10.8%{stroke-dashoffset:1}31.8%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-dashboard-4{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-dashboard-5{0%,34.8%{transform:scale(0);opacity:0}35.8%{opacity:1}46.8%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-dashboard *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<rect class="i antz-l-dashboard-0" x="7" y="7" width="15" height="15" rx="3" pathLength="1"/>
<rect class="i antz-l-dashboard-1" x="26" y="7" width="15" height="9" rx="3" pathLength="1"/>
<rect class="i antz-l-dashboard-2" x="7" y="26" width="15" height="15" rx="3" pathLength="1"/>
<rect class="i antz-l-dashboard-3" x="26" y="20" width="15" height="21" rx="3" pathLength="1"/>
<path class="a antz-l-dashboard-4" d="M29.5 35l3-4 3 2 3-5" pathLength="1"/>
<circle class="a antz-l-dashboard-5" cx="14.5" cy="14.5" r="3"/>
</svg>
