<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-animals" role="img" aria-label="Animals">
<defs><linearGradient id="antz-l-animals-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-animals .i,.antz-l-animals .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-animals .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-animals .a{stroke:url(#antz-l-animals-acc)}
.antz-l-animals .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-animals .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-animals-0{stroke-dasharray:1;animation:antz-l-animals-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-animals-1{animation:antz-l-animals-1 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-animals-2{animation:antz-l-animals-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-animals-3{animation:antz-l-animals-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-animals-4{animation:antz-l-animals-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-animals-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-animals-1{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-animals-2{0%,31.8%{transform:scale(0);opacity:0}32.8%{opacity:1}43.8%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-animals-3{0%,33.6%{transform:scale(0);opacity:0}34.6%{opacity:1}45.6%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-animals-4{0%,35.4%{transform:scale(0);opacity:0}36.4%{opacity:1}47.4%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-animals *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
