<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-lab" role="img" aria-label="Lab">
<defs><linearGradient id="antz-l-lab-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-lab .i,.antz-l-lab .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-lab .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-lab .a{stroke:url(#antz-l-lab-acc)}
.antz-l-lab .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-lab .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-lab-0{stroke-dasharray:1;animation:antz-l-lab-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-lab-1{stroke-dasharray:1;animation:antz-l-lab-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-lab-2{stroke-dasharray:1;animation:antz-l-lab-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-lab-3{stroke-dasharray:1;animation:antz-l-lab-3 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-lab-4{animation:antz-l-lab-4 3600ms cubic-bezier(0.65, 0, 0.35, 1) infinite}
.antz-l-lab-5{animation:antz-l-lab-5 3600ms cubic-bezier(0.65, 0, 0.35, 1) infinite}
.antz-l-lab-6{animation:antz-l-lab-6 3600ms cubic-bezier(0.65, 0, 0.35, 1) infinite}
@keyframes antz-l-lab-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-lab-1{0%,2.7%{stroke-dashoffset:1}23.7%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-lab-2{0%,10.8%{stroke-dashoffset:1}31.8%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-lab-3{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-lab-4{0%,32.4%{transform:translateY(0);opacity:0}36.4%{opacity:1}62.4%{transform:translateY(-12px);opacity:0}100%{opacity:0}}
@keyframes antz-l-lab-5{0%,36%{transform:translateY(0);opacity:0}40%{opacity:1}66%{transform:translateY(-12px);opacity:0}100%{opacity:0}}
@keyframes antz-l-lab-6{0%,39%{transform:translateY(0);opacity:0}43%{opacity:1}69%{transform:translateY(-12px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-lab *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-lab-0" d="M18 7h12" pathLength="1"/>
<path class="i antz-l-lab-1" d="M21 7v11L10.6 36.2A3.2 3.2 0 0 0 13.4 41h21.2a3.2 3.2 0 0 0 2.8-4.8L27 18V7" pathLength="1"/>
<path class="i antz-l-lab-2" d="M27 12h2.5M27 16h2.5" pathLength="1"/>
<path class="a antz-l-lab-3" d="M15 30c3-1.5 6-1.5 9 0s6 1.5 9 0" pathLength="1"/>
<circle class="a antz-l-lab-4" cx="21" cy="35" r="1.2"/>
<circle class="a antz-l-lab-5" cx="27" cy="36" r="1.2"/>
<circle class="a antz-l-lab-6" cx="24" cy="37" r="0.9"/>
</svg>
