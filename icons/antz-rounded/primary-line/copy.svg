<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-copy" role="img" aria-label="Copy">
<defs><linearGradient id="antz-l-copy-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-copy .i,.antz-l-copy .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-copy .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-copy .a{stroke:url(#antz-l-copy-acc)}
.antz-l-copy .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-copy .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-copy .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-copy-0{stroke-dasharray:1;animation:antz-l-copy-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-copy-1{animation:antz-l-copy-1 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-copy-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-copy-1{0%,30%{transform:translate(-6px,-6px);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-copy *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-copy-0" d="M13 30h-1a3 3 0 0 1-3-3V11a3 3 0 0 1 3-3h16a3 3 0 0 1 3 3v2" pathLength="1"/>
