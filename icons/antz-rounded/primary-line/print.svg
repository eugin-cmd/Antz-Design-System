<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-print" role="img" aria-label="Print">
<defs><linearGradient id="antz-l-print-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-print .i,.antz-l-print .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-print .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-print .a{stroke:url(#antz-l-print-acc)}
.antz-l-print .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-print .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-print .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-print-0{stroke-dasharray:1;animation:antz-l-print-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-print-1{stroke-dasharray:1;animation:antz-l-print-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-print-2{animation:antz-l-print-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-print-3{animation:antz-l-print-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-print-4{animation:antz-l-print-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-print-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-print-1{0%,7.2%{stroke-dashoffset:1}28.2%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-print-2{0%,12.6%{transform:scale(0);opacity:0}13.6%{opacity:1}24.6%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-print-3{0%,30%{transform:translateY(-7px);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-print-4{0%,30.6%{transform:translateY(-7px);opacity:0}32.1%{opacity:1}46.6%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-print *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-print-0" d="M12 33H9a3 3 0 0 1-3-3V19a3 3 0 0 1 3-3h30a3 3 0 0 1 3 3v11a3 3 0 0 1-3 3h-3" pathLength="1"/>
<path class="i antz-l-print-1" d="M14 16V7h20v9" pathLength="1"/>
<circle class="i antz-l-print-2" cx="37" cy="22" r="1"/>
<path class="a antz-l-print-3" d="M14 27h20v14H14Z"/>
<path class="a antz-l-print-4" d="M18 32h12M18 36h8"/>
</svg>
