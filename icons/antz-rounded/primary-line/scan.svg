<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-scan" role="img" aria-label="Scan tag">
<defs><linearGradient id="antz-l-scan-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient><mask id="antz-l-scan-cut" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path class="k antz-l-scan-5" d="M10 24h28" fill="none"/></mask></defs>
<style>
.antz-l-scan .i,.antz-l-scan .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-scan .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
