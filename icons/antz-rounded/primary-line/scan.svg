.antz-l-scan-0{stroke-dasharray:1;animation:antz-l-scan-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-scan-1{stroke-dasharray:1;animation:antz-l-scan-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-scan-2{stroke-dasharray:1;animation:antz-l-scan-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-scan-3{stroke-dasharray:1;animation:antz-l-scan-3 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-scan-4{stroke-dasharray:1;animation:antz-l-scan-4 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-scan-5{animation:antz-l-scan-5 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-scan-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-scan-1{0%,5.4%{stroke-dashoffset:1}26.4%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-scan-2{0%,8.1%{stroke-dashoffset:1}29.1%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-scan-3{0%,10.8%{stroke-dashoffset:1}31.8%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-scan-4{0%,13.5%{stroke-dashoffset:1}34.5%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-scan-5{0%,30%{transform:translateY(-12px);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-scan *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
