<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-hourglass" role="img" aria-label="Hourglass">
<defs><linearGradient id="antz-l-hourglass-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-hourglass .i,.antz-l-hourglass .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-hourglass .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-hourglass .a{stroke:url(#antz-l-hourglass-acc)}
.antz-l-hourglass .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-hourglass .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-hourglass .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-hourglass-0{stroke-dasharray:1;animation:antz-l-hourglass-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-hourglass-1{stroke-dasharray:1;animation:antz-l-hourglass-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-hourglass-2{animation:antz-l-hourglass-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-hourglass-3{animation:antz-l-hourglass-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-hourglass-g{transform-origin:24px 24px;animation:antz-l-hourglass-g 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-hourglass-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-hourglass-1{0%,5.4%{stroke-dashoffset:1}26.4%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-hourglass-2{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-hourglass-3{0%,33.6%{transform:translateY(-5px);opacity:0}35.1%{opacity:1}49.6%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-hourglass-g{0%,50%{transform:rotate(0)}66%,100%{transform:rotate(180deg)}}
@media (prefers-reduced-motion:reduce){.antz-l-hourglass *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-hourglass-g">
<path class="i antz-l-hourglass-0" d="M12 6h24M12 42h24" pathLength="1"/>
<path class="i antz-l-hourglass-1" d="M15 6c0 9 7.5 12 7.5 18S15 33 15 42M33 6c0 9-7.5 12-7.5 18S33 33 33 42" pathLength="1"/>
<path class="a antz-l-hourglass-2" d="M19.5 38.5h9l-4.5-4Z"/>
<circle class="a antz-l-hourglass-3" cx="24" cy="29" r="0.8"/>
</g>
</svg>
