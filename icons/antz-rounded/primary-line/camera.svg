<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-camera" role="img" aria-label="Camera">
<defs><linearGradient id="antz-l-camera-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-camera .i,.antz-l-camera .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-camera .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-camera .a{stroke:url(#antz-l-camera-acc)}
.antz-l-camera .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-camera .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-camera .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-camera-0{stroke-dasharray:1;animation:antz-l-camera-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-camera-1{stroke-dasharray:1;animation:antz-l-camera-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-camera-2{animation:antz-l-camera-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-camera-3{animation:antz-l-camera-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-camera-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-camera-1{0%,9%{stroke-dashoffset:1}30%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-camera-2{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-camera-3{0%,34.8%{transform:scale(0);opacity:0}35.8%{opacity:1}46.8%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-camera *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-camera-0" d="M6 17a3 3 0 0 1 3-3h6l3-4h12l3 4h6a3 3 0 0 1 3 3v20a3 3 0 0 1-3 3H9a3 3 0 0 1-3-3Z" pathLength="1"/>
<circle class="i antz-l-camera-1" cx="24" cy="26" r="7.5" pathLength="1"/>
<circle class="a antz-l-camera-2" cx="24" cy="26" r="3"/>
<circle class="a antz-l-camera-3" cx="36" cy="19.5" r="1"/>
</svg>
