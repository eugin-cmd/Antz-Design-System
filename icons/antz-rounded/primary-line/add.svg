<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-add" role="img" aria-label="Add">
<defs><linearGradient id="antz-l-add-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-add .i,.antz-l-add .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-add .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-add .a{stroke:url(#antz-l-add-acc)}
.antz-l-add .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-add .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-add .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-add-0{stroke-dasharray:1;animation:antz-l-add-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-add-1{transform-box:view-box;transform-origin:24px 24px;animation:antz-l-add-1 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-add-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-add-1{0%,30%{transform:rotate(-90deg) scale(0);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-add *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<circle class="i antz-l-add-0" cx="24" cy="24" r="17" pathLength="1"/>
<path class="a antz-l-add-1" d="M24 16v16M16 24h16"/>
</svg>
