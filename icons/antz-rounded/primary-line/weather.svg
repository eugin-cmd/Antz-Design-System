<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-weather" role="img" aria-label="Weather">
<defs><linearGradient id="antz-l-weather-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient><mask id="antz-l-weather-cut" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><path class="k antz-l-weather-0" d="M15 40h20a7 7 0 0 0 .6-14A9.5 9.5 0 0 0 17 28.6 5.8 5.8 0 0 0 15 40Z" pathLength="1" fill="#000"/></mask></defs>
<style>
.antz-l-weather .i,.antz-l-weather .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-weather .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-weather .a{stroke:url(#antz-l-weather-acc)}
.antz-l-weather .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-weather .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-weather .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-weather-0{stroke-dasharray:1;animation:antz-l-weather-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-weather-1{animation:antz-l-weather-1 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
.antz-l-weather-2{animation:antz-l-weather-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-weather-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-weather-1{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,100%{transform:scale(1);opacity:1}}
@keyframes antz-l-weather-2{0%,34.8%{transform:scale(0);opacity:0}35.8%{opacity:1}46.8%,100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-weather *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g mask="url(#antz-l-weather-cut)">
<circle class="a antz-l-weather-1" cx="17" cy="16" r="5.5"/>
