<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-mortality" role="img" aria-label="Mortality">
<defs><linearGradient id="antz-l-mortality-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-mortality .i,.antz-l-mortality .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-mortality .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-mortality .a{stroke:url(#antz-l-mortality-acc)}
.antz-l-mortality .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-mortality .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-mortality .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-mortality-0{stroke-dasharray:1;animation:antz-l-mortality-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-mortality-1{stroke-dasharray:1;animation:antz-l-mortality-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-mortality-2{stroke-dasharray:1;animation:antz-l-mortality-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-mortality-3{stroke-dasharray:1;animation:antz-l-mortality-3 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-mortality-4{stroke-dasharray:1;animation:antz-l-mortality-4 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
@keyframes antz-l-mortality-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-mortality-1{0%,5.4%{stroke-dashoffset:1}26.4%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-mortality-2{0%,9.9%{stroke-dashoffset:1}30.9%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-mortality-3{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-mortality-4{0%,34.2%{stroke-dashoffset:1}48.2%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-mortality *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
