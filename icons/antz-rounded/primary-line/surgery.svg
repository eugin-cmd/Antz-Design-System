<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-surgery" role="img" aria-label="Surgery">
<defs><linearGradient id="antz-l-surgery-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-surgery .i,.antz-l-surgery .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-surgery .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-surgery .a{stroke:url(#antz-l-surgery-acc)}
.antz-l-surgery .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-surgery .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-surgery .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-surgery-0{stroke-dasharray:1;animation:antz-l-surgery-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-surgery-1{stroke-dasharray:1;animation:antz-l-surgery-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-surgery-2{animation:antz-l-surgery-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-surgery-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-surgery-1{0%,9%{stroke-dashoffset:1}30%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-surgery-2{0%,30%{transform:translate(-4px,4px);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-surgery *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-surgery-0" d="M7 41l15-15" pathLength="1"/>
<path class="i antz-l-surgery-1" d="M8 13h3M15 13h3M22 13h3" pathLength="1"/>
<path class="a antz-l-surgery-2" d="M22 26l12-12c3-3 7-2 7 1-6 8-12 12-17 13Z"/>
