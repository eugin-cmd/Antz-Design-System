<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-pie_chart" role="img" aria-label="Pie chart">
<defs><linearGradient id="antz-l-pie_chart-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-pie_chart .i,.antz-l-pie_chart .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-pie_chart .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-pie_chart .a{stroke:url(#antz-l-pie_chart-acc)}
.antz-l-pie_chart .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-pie_chart .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-pie_chart .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-pie_chart-0{stroke-dasharray:1;animation:antz-l-pie_chart-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-pie_chart-1{animation:antz-l-pie_chart-1 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-pie_chart-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-pie_chart-1{0%,30%{transform:translate(-4px,4px);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-pie_chart *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-pie_chart-0" d="M24 8a16 16 0 1 0 16 16H24Z" pathLength="1"/>
<path class="a antz-l-pie_chart-1" d="M28 4v16h16A16 16 0 0 0 28 4Z"/>
</svg>
