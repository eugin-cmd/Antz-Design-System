<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-transfers" role="img" aria-label="Transfers">
<defs><linearGradient id="antz-l-transfers-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-transfers .i,.antz-l-transfers .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-transfers .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-transfers .a{stroke:url(#antz-l-transfers-acc)}
.antz-l-transfers .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-transfers .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-transfers-0{stroke-dasharray:1;animation:antz-l-transfers-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-transfers-1{animation:antz-l-transfers-1 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-transfers-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-transfers-1{0%,30%{transform:translateX(-7px);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-transfers *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-transfers-0" d="M40 31H10M16 25l-6 6 6 6" pathLength="1"/>
<path class="a antz-l-transfers-1" d="M8 17h30M32 11l6 6-6 6"/>
</svg>
