<circle class="a antz-l-bandage-3" cx="24" cy="26" r="0.6"/>
<circle class="a antz-l-bandage-4" cx="22" cy="24" r="0.6"/>
<circle class="a antz-l-bandage-5" cx="26" cy="24" r="0.6"/>
</svg>
