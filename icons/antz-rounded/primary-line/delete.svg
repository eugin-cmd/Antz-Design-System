<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-delete" role="img" aria-label="Delete">
<defs><linearGradient id="antz-l-delete-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-delete .i,.antz-l-delete .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-delete .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-delete .a{stroke:url(#antz-l-delete-acc)}
.antz-l-delete .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-delete .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-delete-0{stroke-dasharray:1;animation:antz-l-delete-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-delete-1{stroke-dasharray:1;animation:antz-l-delete-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-delete-2{transform-box:view-box;transform-origin:8px 15px;animation:antz-l-delete-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-delete-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-delete-1{0%,9%{stroke-dashoffset:1}30%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-delete-2{0%,30%{transform:translateY(-6px) rotate(-14deg);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-delete *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
