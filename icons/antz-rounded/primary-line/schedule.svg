<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-schedule" role="img" aria-label="Schedule">
<defs><linearGradient id="antz-l-schedule-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient><mask id="antz-l-schedule-cut" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><circle class="k antz-l-schedule-2" cx="34" cy="34" r="8" fill="#000"/><path class="k antz-l-schedule-3" d="M34 30v4l3 2" fill="none"/></mask></defs>
<style>
.antz-l-schedule .i,.antz-l-schedule .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-schedule .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-schedule .a{stroke:url(#antz-l-schedule-acc)}
.antz-l-schedule .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-schedule .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-schedule .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-schedule-0{stroke-dasharray:1;animation:antz-l-schedule-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-schedule-1{stroke-dasharray:1;animation:antz-l-schedule-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-schedule-2{animation:antz-l-schedule-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-schedule-3{transform-box:view-box;transform-origin:34px 34px;animation:antz-l-schedule-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-schedule-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-schedule-1{0%,7.2%{stroke-dashoffset:1}28.2%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-schedule-2{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-schedule-3{0%,33.6%{transform:rotate(-90deg);opacity:0}35.1%{opacity:1}49.6%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-schedule *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g mask="url(#antz-l-schedule-cut)">
<rect class="i antz-l-schedule-0" x="6" y="10" width="28" height="28" rx="3" pathLength="1"/>
<path class="i antz-l-schedule-1" d="M13 6v7M27 6v7M6 18h28" pathLength="1"/>
</g>
<circle class="a antz-l-schedule-2" cx="34" cy="34" r="8"/>
<path class="a antz-l-schedule-3" d="M34 30v4l3 2"/>
</svg>
