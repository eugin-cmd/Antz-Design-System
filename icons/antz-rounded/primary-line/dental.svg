<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-dental" role="img" aria-label="Dental">
<defs><linearGradient id="antz-l-dental-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-dental .i,.antz-l-dental .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-dental .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-dental .a{stroke:url(#antz-l-dental-acc)}
.antz-l-dental .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-dental .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-dental .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-dental-0{stroke-dasharray:1;animation:antz-l-dental-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-dental-1{stroke-dasharray:1;animation:antz-l-dental-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-dental-2{animation:antz-l-dental-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-dental-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-dental-1{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-dental-2{0%,34.8%{transform:scale(0);opacity:0}35.8%{opacity:1}46.8%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-dental *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
