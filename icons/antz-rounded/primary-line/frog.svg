<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-frog" role="img" aria-label="Frog">
<defs><linearGradient id="antz-l-frog-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient><mask id="antz-l-frog-cut" maskUnits="userSpaceOnUse" x="-8" y="-8" width="64" height="64"><rect x="-8" y="-8" width="64" height="64" fill="#fff"/><circle class="k antz-l-frog-1" cx="14.5" cy="16" r="5" pathLength="1" fill="#000"/><circle class="k antz-l-frog-2" cx="33.5" cy="16" r="5" pathLength="1" fill="#000"/><circle class="k antz-l-frog-3" cx="14.5" cy="16" r="1.6" fill="#000"/><circle class="k antz-l-frog-4" cx="33.5" cy="16" r="1.6" fill="#000"/></mask></defs>
<style>
.antz-l-frog .i,.antz-l-frog .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-frog .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-frog .a{stroke:url(#antz-l-frog-acc)}
.antz-l-frog .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-frog .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-frog .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-frog-0{stroke-dasharray:1;animation:antz-l-frog-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-frog-1{stroke-dasharray:1;animation:antz-l-frog-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-frog-2{stroke-dasharray:1;animation:antz-l-frog-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-frog-3{animation:antz-l-frog-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-frog-4{animation:antz-l-frog-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-frog-5{stroke-dasharray:1;animation:antz-l-frog-5 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-frog-g{transform-origin:24px 24px;animation:antz-l-frog-g 3600ms cubic-bezier(0.65, 0, 0.35, 1) infinite}
@keyframes antz-l-frog-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-frog-1{0%,5.4%{stroke-dashoffset:1}26.4%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-frog-2{0%,7.2%{stroke-dashoffset:1}28.2%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-frog-3{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-frog-4{0%,31.2%{transform:scale(0);opacity:0}32.2%{opacity:1}43.2%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-frog-5{0%,34.8%{stroke-dashoffset:1}48.8%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-frog-g{0%,52%{transform:translateY(0)}57%{transform:translateY(-5px)}63%{transform:translateY(0)}67%{transform:translateY(-2px)}71%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.antz-l-frog *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-frog-g">
<g mask="url(#antz-l-frog-cut)">
<path class="i antz-l-frog-0" d="M11 20.5C9 22.6 8 25.6 8 29c0 7 7 11 16 11s16-4 16-11c0-3.4-1-6.4-3-8.5" pathLength="1"/>
<path class="a antz-l-frog-5" d="M17 31c4 3 10 3 14 0" pathLength="1"/>
</g>
<circle class="i antz-l-frog-1" cx="14.5" cy="16" r="5" pathLength="1"/>
<circle class="i antz-l-frog-2" cx="33.5" cy="16" r="5" pathLength="1"/>
<circle class="a antz-l-frog-3" cx="14.5" cy="16" r="1.6"/>
<circle class="a antz-l-frog-4" cx="33.5" cy="16" r="1.6"/>
</g>
</svg>
