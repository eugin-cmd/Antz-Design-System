<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-line_chart" role="img" aria-label="Line chart">
<defs><linearGradient id="antz-l-line_chart-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-line_chart .i,.antz-l-line_chart .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-line_chart .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-line_chart .a{stroke:url(#antz-l-line_chart-acc)}
.antz-l-line_chart .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-line_chart .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-line_chart .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-line_chart-0{stroke-dasharray:1;animation:antz-l-line_chart-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-line_chart-1{stroke-dasharray:1;animation:antz-l-line_chart-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-line_chart-2{animation:antz-l-line_chart-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-line_chart-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-line_chart-1{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-line_chart-2{0%,36%{transform:scale(0);opacity:0}37%{opacity:1}48%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-line_chart *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-line_chart-0" d="M7 7v32a2 2 0 0 0 2 2h32" pathLength="1"/>
<path class="a antz-l-line_chart-1" d="M13 31l7-9 6 5 8.6-11.5" pathLength="1"/>
<circle class="a antz-l-line_chart-2" cx="36.6" cy="12.9" r="1.6"/>
</svg>
