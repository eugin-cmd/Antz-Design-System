.antz-l-prescription .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-prescription .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-prescription-0{stroke-dasharray:1;animation:antz-l-prescription-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-prescription-1{stroke-dasharray:1;animation:antz-l-prescription-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-prescription-2{stroke-dasharray:1;animation:antz-l-prescription-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
@keyframes antz-l-prescription-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-prescription-1{0%,7.2%{stroke-dashoffset:1}28.2%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-prescription-2{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
