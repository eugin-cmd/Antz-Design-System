<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-prescription" role="img" aria-label="Prescription">
<defs><linearGradient id="antz-l-prescription-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-prescription .i,.antz-l-prescription .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-prescription .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-prescription .a{stroke:url(#antz-l-prescription-acc)}
