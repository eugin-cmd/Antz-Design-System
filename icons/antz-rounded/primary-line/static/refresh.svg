<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-refresh" role="img" aria-label="Refresh">
<defs><linearGradient id="antz-l-refresh-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-refresh .i,.antz-l-refresh .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-refresh .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-refresh .a{stroke:url(#antz-l-refresh-acc)}
.antz-l-refresh .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-refresh .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-refresh .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
</style>
