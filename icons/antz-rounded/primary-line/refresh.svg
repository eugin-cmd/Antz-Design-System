<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-refresh" role="img" aria-label="Refresh">
<defs><linearGradient id="antz-l-refresh-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-refresh .i,.antz-l-refresh .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-refresh .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-refresh .a{stroke:url(#antz-l-refresh-acc)}
.antz-l-refresh .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-refresh .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-refresh .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-refresh-0{stroke-dasharray:1;animation:antz-l-refresh-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-refresh-1{stroke-dasharray:1;animation:antz-l-refresh-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-refresh-2{stroke-dasharray:1;animation:antz-l-refresh-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-refresh-3{stroke-dasharray:1;animation:antz-l-refresh-3 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-refresh-g{transform-origin:24px 24px;animation:antz-l-refresh-g 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-refresh-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-refresh-1{0%,5.4%{stroke-dashoffset:1}26.4%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-refresh-2{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-refresh-3{0%,33.6%{stroke-dashoffset:1}47.6%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-refresh-g{0%,50%{transform:rotate(0)}66%,100%{transform:rotate(180deg)}}
@media (prefers-reduced-motion:reduce){.antz-l-refresh *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-refresh-g">
<path class="i antz-l-refresh-0" d="M39 20A15.5 15.5 0 0 0 11 15" pathLength="1"/>
<path class="i antz-l-refresh-1" d="M9 28a15.5 15.5 0 0 0 28 5" pathLength="1"/>
<path class="a antz-l-refresh-2" d="M11 8v7h7" pathLength="1"/>
<path class="a antz-l-refresh-3" d="M37 40v-7h-7" pathLength="1"/>
</g>
</svg>
