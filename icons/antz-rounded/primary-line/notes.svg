<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-notes" role="img" aria-label="Notes">
<defs><linearGradient id="antz-l-notes-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-notes .i,.antz-l-notes .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-notes .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-notes .a{stroke:url(#antz-l-notes-acc)}
.antz-l-notes .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-notes .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-notes-0{stroke-dasharray:1;animation:antz-l-notes-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-notes-1{stroke-dasharray:1;animation:antz-l-notes-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-notes-2{animation:antz-l-notes-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-notes-3{animation:antz-l-notes-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-notes-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-notes-1{0%,7.2%{stroke-dashoffset:1}28.2%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-notes-2{0%,30%{transform:translate(5px,-5px) rotate(12deg);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-notes-3{0%,30.6%{transform:translate(5px,-5px);opacity:0}32.1%{opacity:1}46.6%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-notes *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<rect class="i antz-l-notes-0" x="8" y="7" width="24" height="34" rx="3" pathLength="1"/>
