<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-power" role="img" aria-label="Power">
<defs><linearGradient id="antz-l-power-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-power .i,.antz-l-power .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-power .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-power .a{stroke:url(#antz-l-power-acc)}
.antz-l-power .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-power .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-power .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-power-0{stroke-dasharray:1;animation:antz-l-power-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-power-1{stroke-dasharray:1;animation:antz-l-power-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-power-2{stroke-dasharray:1;animation:antz-l-power-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-power-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-power-1{0%,9%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
@keyframes antz-l-power-2{0%,30%{stroke-dashoffset:1;transform:scale(1)}44%{stroke-dashoffset:0;transform:scale(1)}52%{transform:scale(1.18)}64%,100%{stroke-dashoffset:0;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.antz-l-power *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<rect class="i antz-l-power-0" x="7" y="14" width="31" height="20" rx="3" pathLength="1"/>
<path class="i antz-l-power-1" d="M41 20v8" pathLength="1"/>
<path class="a antz-l-power-2" d="M25 19l-5 5.5h6l-5 5.5" pathLength="1"/>
</svg>
