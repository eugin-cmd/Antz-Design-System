<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-home" role="img" aria-label="Home">
<defs><linearGradient id="antz-l-home-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-home .i,.antz-l-home .a{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-home .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-home .a{stroke:url(#antz-l-home-acc)}
.antz-l-home .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-home .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-home-0{stroke-dasharray:1;animation:antz-l-home-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-home-1{stroke-dasharray:1;animation:antz-l-home-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-home-2{stroke-dasharray:1;animation:antz-l-home-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-home-3{stroke-dasharray:1;animation:antz-l-home-3 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-home-4{animation:antz-l-home-4 3600ms cubic-bezier(0.65, 0, 0.35, 1) infinite}
.antz-l-home-5{animation:antz-l-home-5 3600ms cubic-bezier(0.65, 0, 0.35, 1) infinite}
@keyframes antz-l-home-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-home-1{0%,4.5%{stroke-dashoffset:1}25.5%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-home-2{0%,8.1%{stroke-dashoffset:1}29.1%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-home-3{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-home-4{0%,33.6%{transform:translateY(0);opacity:0}37.6%{opacity:1}63.6%{transform:translateY(-5px);opacity:0}100%{opacity:0}}
@keyframes antz-l-home-5{0%,37.2%{transform:translateY(0);opacity:0}41.2%{opacity:1}67.2%{transform:translateY(-4px);opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-home *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
