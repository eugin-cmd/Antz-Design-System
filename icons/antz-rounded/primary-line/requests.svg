<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-requests" role="img" aria-label="Requests">
<defs><linearGradient id="antz-l-requests-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-requests .i,.antz-l-requests .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-requests .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-requests .a{stroke:url(#antz-l-requests-acc)}
.antz-l-requests .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-requests .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-requests-0{stroke-dasharray:1;animation:antz-l-requests-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-requests-1{stroke-dasharray:1;animation:antz-l-requests-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-requests-2{stroke-dasharray:1;animation:antz-l-requests-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-requests-3{animation:antz-l-requests-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-requests-4{stroke-dasharray:1;animation:antz-l-requests-4 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
@keyframes antz-l-requests-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-requests-1{0%,5.4%{stroke-dashoffset:1}26.4%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-requests-2{0%,9.9%{stroke-dashoffset:1}30.9%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-requests-3{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-requests-4{0%,34.8%{stroke-dashoffset:1}48.8%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
