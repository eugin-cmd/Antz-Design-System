<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-reports" role="img" aria-label="Reports">
<defs><linearGradient id="antz-l-reports-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-reports .i,.antz-l-reports .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-reports .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-reports .a{stroke:url(#antz-l-reports-acc)}
.antz-l-reports .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-reports .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-reports-0{stroke-dasharray:1;animation:antz-l-reports-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-reports-1{transform-box:view-box;transform-origin:16px 33px;animation:antz-l-reports-1 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-reports-2{transform-box:view-box;transform-origin:24px 33px;animation:antz-l-reports-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-reports-3{transform-box:view-box;transform-origin:32px 33px;animation:antz-l-reports-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-reports-4{transform-box:view-box;transform-origin:40px 33px;animation:antz-l-reports-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-reports-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-reports-1{0%,30%{transform:scaleY(0);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-reports-2{0%,32.4%{transform:scaleY(0);opacity:0}33.9%{opacity:1}48.4%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-reports-3{0%,34.8%{transform:scaleY(0);opacity:0}36.3%{opacity:1}50.8%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-reports-4{0%,37.2%{transform:scaleY(0);opacity:0}38.7%{opacity:1}53.2%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-reports *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-reports-0" d="M8 7v31a2 2 0 0 0 2 2h31" pathLength="1"/>
<path class="a antz-l-reports-1" d="M16 33v-8"/>
<path class="a antz-l-reports-2" d="M24 33V17"/>
<path class="a antz-l-reports-3" d="M32 33V22"/>
<path class="a antz-l-reports-4" d="M40 33V12"/>
</svg>
