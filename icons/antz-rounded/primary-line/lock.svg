<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-lock" role="img" aria-label="Lock">
<defs><linearGradient id="antz-l-lock-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-lock .i,.antz-l-lock .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-lock .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-lock .a{stroke:url(#antz-l-lock-acc)}
.antz-l-lock .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-lock .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-lock .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-lock-0{stroke-dasharray:1;animation:antz-l-lock-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-lock-1{stroke-dasharray:1;animation:antz-l-lock-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-lock-2{animation:antz-l-lock-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-lock-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-lock-1{0%,9%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
@keyframes antz-l-lock-2{0%,30%{transform:translateY(-5px);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-lock *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<rect class="i antz-l-lock-0" x="10" y="22" width="28" height="20" rx="4" pathLength="1"/>
<path class="i antz-l-lock-1" d="M24 30v4" pathLength="1"/>
<path class="a antz-l-lock-2" d="M16 22v-6a8 8 0 0 1 16 0v6"/>
</svg>
