<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-edit" role="img" aria-label="Edit">
<defs><linearGradient id="antz-l-edit-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-edit .i,.antz-l-edit .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-edit .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-edit .a{stroke:url(#antz-l-edit-acc)}
.antz-l-edit .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-edit .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-edit .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-edit-0{stroke-dasharray:1;animation:antz-l-edit-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-edit-1{animation:antz-l-edit-1 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-edit-2{animation:antz-l-edit-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-edit-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-edit-1{0%,30%{transform:translate(-5px,5px) rotate(-8deg);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-edit-2{0%,30.6%{transform:translate(-5px,5px);opacity:0}32.1%{opacity:1}46.6%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-edit *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-edit-0" d="M8 41h20" pathLength="1"/>
<path class="a antz-l-edit-1" d="M30 9l7 7-19 19h-7v-7Z"/>
<path class="a antz-l-edit-2" d="M26 13l7 7"/>
</svg>
