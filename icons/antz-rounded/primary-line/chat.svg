<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-chat" role="img" aria-label="Chat">
<defs><linearGradient id="antz-l-chat-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-chat .i,.antz-l-chat .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-chat .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-chat .a{stroke:url(#antz-l-chat-acc)}
.antz-l-chat .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-chat .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-chat-0{stroke-dasharray:1;animation:antz-l-chat-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-chat-1{animation:antz-l-chat-1 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-chat-2{animation:antz-l-chat-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-chat-3{animation:antz-l-chat-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-chat-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-chat-1{0%,30%{transform:scale(0);opacity:0}31%{opacity:1}42%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-chat-2{0%,33%{transform:scale(0);opacity:0}34%{opacity:1}45%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-chat-3{0%,36%{transform:scale(0);opacity:0}37%{opacity:1}48%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-chat *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-chat-0" d="M12 8h24a4 4 0 0 1 4 4v16a4 4 0 0 1-4 4H22l-8 7v-7h-2a4 4 0 0 1-4-4V12a4 4 0 0 1 4-4Z" pathLength="1"/>
<circle class="a antz-l-chat-1" cx="17" cy="20" r="1.6"/>
<circle class="a antz-l-chat-2" cx="24" cy="20" r="1.6"/>
<circle class="a antz-l-chat-3" cx="31" cy="20" r="1.6"/>
</svg>
