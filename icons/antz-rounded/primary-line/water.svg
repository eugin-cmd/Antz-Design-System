<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-water" role="img" aria-label="Water">
<defs><linearGradient id="antz-l-water-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-water .i,.antz-l-water .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-water .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-water .a{stroke:url(#antz-l-water-acc)}
.antz-l-water .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-water .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-water .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-water-0{stroke-dasharray:1;animation:antz-l-water-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-water-1{stroke-dasharray:1;animation:antz-l-water-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-water-g{transform-origin:24px 24px;animation:antz-l-water-g 2800ms cubic-bezier(0.65, 0, 0.35, 1) both}
@keyframes antz-l-water-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-water-1{0%,30%{stroke-dashoffset:1}44%,100%{stroke-dashoffset:0}}
@keyframes antz-l-water-g{0%,52%{transform:translateY(0)}57%{transform:translateY(-5px)}63%{transform:translateY(0)}67%{transform:translateY(-2px)}71%,100%{transform:translateY(0)}}
@media (prefers-reduced-motion:reduce){.antz-l-water *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-water-g">
<path class="i antz-l-water-0" d="M24 6s12 13.5 12 22a12 12 0 0 1-24 0c0-8.5 12-22 12-22Z" pathLength="1"/>
<path class="a antz-l-water-1" d="M18 29a6 6 0 0 0 5 5.5" pathLength="1"/>
</g>
</svg>
