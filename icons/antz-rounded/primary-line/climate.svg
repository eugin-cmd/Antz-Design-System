<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-climate" role="img" aria-label="Climate control">
<defs><linearGradient id="antz-l-climate-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-climate .i,.antz-l-climate .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-climate .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-climate .a{stroke:url(#antz-l-climate-acc)}
.antz-l-climate .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-climate .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-climate .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-climate-0{stroke-dasharray:1;animation:antz-l-climate-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-climate-1{stroke-dasharray:1;animation:antz-l-climate-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-climate-2{stroke-dasharray:1;animation:antz-l-climate-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-climate-3{transform-box:view-box;transform-origin:24px 24px;animation:antz-l-climate-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-climate-4{animation:antz-l-climate-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-climate-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-climate-1{0%,5.4%{stroke-dashoffset:1}26.4%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-climate-2{0%,9%{stroke-dashoffset:1}30%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-climate-3{0%,30%{transform:rotate(-120deg);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-climate-4{0%,32.4%{transform:scale(0);opacity:0}33.4%{opacity:1}44.4%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-climate *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<circle class="i antz-l-climate-0" cx="24" cy="24" r="16" pathLength="1"/>
<circle class="i antz-l-climate-1" cx="24" cy="24" r="9" pathLength="1"/>
<path class="i antz-l-climate-2" d="M36 24L37.4 24M34.4 30L35.6 30.7M30 34.4L30.7 35.6M24 36L24 37.4M18 34.4L17.3 35.6M13.6 30L12.4 30.7M12 24L10.6 24M13.6 18L12.4 17.3M18 13.6L17.3 12.4M24 12L24 10.6M30 13.6L30.7 12.4M34.4 18L35.6 17.3" pathLength="1"/>
<path class="a antz-l-climate-3" d="M24 24l4.5-4.5"/>
<circle class="a antz-l-climate-4" cx="24" cy="24" r="1.2"/>
</svg>
