<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-timer" role="img" aria-label="Timer">
<defs><linearGradient id="antz-l-timer-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-timer .i,.antz-l-timer .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-timer .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-timer .a{stroke:url(#antz-l-timer-acc)}
.antz-l-timer .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-timer .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-timer .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-timer-0{stroke-dasharray:1;animation:antz-l-timer-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-timer-1{stroke-dasharray:1;animation:antz-l-timer-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-timer-2{stroke-dasharray:1;animation:antz-l-timer-2 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-timer-3{transform-box:view-box;transform-origin:24px 27px;animation:antz-l-timer-3 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-timer-4{animation:antz-l-timer-4 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
@keyframes antz-l-timer-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-timer-1{0%,6.3%{stroke-dashoffset:1}27.3%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-timer-2{0%,9.9%{stroke-dashoffset:1}30.9%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-timer-3{0%,30%{transform:rotate(-150deg);opacity:0}31.5%{opacity:1}46%,90%{transform:none;opacity:1}97%,100%{transform:none;opacity:0}}
@keyframes antz-l-timer-4{0%,32.4%{transform:scale(0);opacity:0}33.4%{opacity:1}44.4%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@media (prefers-reduced-motion:reduce){.antz-l-timer *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<circle class="i antz-l-timer-0" cx="24" cy="27" r="14" pathLength="1"/>
<path class="i antz-l-timer-1" d="M21 6h6M24 6v7M36 15l2.5-2.5" pathLength="1"/>
<path class="i antz-l-timer-2" d="M34 27L35.2 27M32.7 32L33.7 32.6M29 35.7L29.6 36.7M24 37L24 38.2M19 35.7L18.4 36.7M15.3 32L14.3 32.6M14 27L12.8 27M15.3 22L14.3 21.4M19 18.3L18.4 17.3M29 18.3L29.6 17.3M32.7 22L33.7 21.4" pathLength="1"/>
<path class="a antz-l-timer-3" d="M24 27v-7.5"/>
<circle class="a antz-l-timer-4" cx="24" cy="27" r="1.3"/>
</svg>
