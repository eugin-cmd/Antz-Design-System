<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-pill" role="img" aria-label="Pill">
<defs><linearGradient id="antz-l-pill-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-pill .i,.antz-l-pill .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-pill .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-pill .a{stroke:url(#antz-l-pill-acc)}
.antz-l-pill .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-pill .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-pill .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-pill-0{stroke-dasharray:1;animation:antz-l-pill-0 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-pill-1{stroke-dasharray:1;animation:antz-l-pill-1 3600ms cubic-bezier(0.16, 1, 0.3, 1) infinite}
.antz-l-pill-2{animation:antz-l-pill-2 3600ms cubic-bezier(0.34, 1.56, 0.64, 1) infinite}
.antz-l-pill-g{transform-origin:24px 40px;animation:antz-l-pill-g 3600ms cubic-bezier(0.65, 0, 0.35, 1) infinite}
@keyframes antz-l-pill-0{0%,0%{stroke-dashoffset:1}21%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-pill-1{0%,30%{stroke-dashoffset:1}44%,90%{stroke-dashoffset:0;opacity:1}97%,100%{stroke-dashoffset:0;opacity:0}}
@keyframes antz-l-pill-2{0%,36%{transform:scale(0);opacity:0}37%{opacity:1}48%,90%{transform:scale(1);opacity:1}97%,100%{transform:scale(1);opacity:0}}
@keyframes antz-l-pill-g{0%,52%{transform:rotate(0)}56%{transform:rotate(-7deg)}61%{transform:rotate(6deg)}66%{transform:rotate(-3deg)}71%,100%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){.antz-l-pill *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<g class="antz-l-pill-g">
