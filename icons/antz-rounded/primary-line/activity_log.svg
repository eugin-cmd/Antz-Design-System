<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" class="antz-l-activity_log" role="img" aria-label="Activity log">
<defs><linearGradient id="antz-l-activity_log-acc" x1="4" y1="4" x2="44" y2="44" gradientUnits="userSpaceOnUse"><stop offset="0" class="acc-a"/><stop offset="1" class="acc-b"/></linearGradient></defs>
<style>
.antz-l-activity_log .i,.antz-l-activity_log .a{fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-activity_log .i{stroke:var(--antz-ink,var(--color-text,#0E1512))}
.antz-l-activity_log .a{stroke:url(#antz-l-activity_log-acc)}
.antz-l-activity_log .k{stroke:#000;stroke-width:4.5;stroke-linecap:round;stroke-linejoin:round;transform-box:fill-box;transform-origin:center}
.antz-l-activity_log .acc-a{stop-color:var(--antz-accent-a,var(--scale-primary-600,#21924E))}.antz-l-activity_log .acc-b{stop-color:var(--antz-accent-b,var(--scale-secondary-600,#00A698))}
.antz-l-activity_log-0{stroke-dasharray:1;animation:antz-l-activity_log-0 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-activity_log-1{stroke-dasharray:1;animation:antz-l-activity_log-1 2800ms cubic-bezier(0.16, 1, 0.3, 1) both}
.antz-l-activity_log-2{transform-box:view-box;transform-origin:24px 25px;animation:antz-l-activity_log-2 2800ms cubic-bezier(0.34, 1.56, 0.64, 1) both}
@keyframes antz-l-activity_log-0{0%,0%{stroke-dashoffset:1}21%,100%{stroke-dashoffset:0}}
@keyframes antz-l-activity_log-1{0%,9%{stroke-dashoffset:1}30%,100%{stroke-dashoffset:0}}
@keyframes antz-l-activity_log-2{0%,30%{transform:rotate(-60deg);opacity:0}31.5%{opacity:1}46%,100%{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.antz-l-activity_log *{animation:none!important;stroke-dashoffset:0!important;opacity:1!important;transform:none!important}}
</style>
<path class="i antz-l-activity_log-0" d="M8.5 27A16 16 0 1 0 12.7 12.7L8 17" pathLength="1"/>
<path class="i antz-l-activity_log-1" d="M8 9v8h8" pathLength="1"/>
<path class="a antz-l-activity_log-2" d="M24 15v10l6 4"/>
</svg>
