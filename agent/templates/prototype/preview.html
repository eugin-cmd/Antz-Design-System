<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{NAME}} · prototype preview</title>
<!-- Antz Design System {{VERSION}} prototype preview: every screen in four device frames. Generated by /systemprototype. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{RELEASE}}/tokens.css">
<link rel="stylesheet" href="{{RELEASE}}/components.css">
<style>
  html, body { margin: 0; }
  body { font-family: var(--font-body); background: var(--color-bg-app); color: var(--color-text); }
  [hidden] { display: none !important; }
  .pv-bar { position: sticky; top: 0; z-index: 10; display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-2) var(--space-3); padding: var(--space-3) var(--space-5); background: var(--color-surface); box-shadow: inset 0 -1px 0 var(--color-border); }
  .pv-bar h1 { flex: 1 1 220px; margin: 0; font-size: var(--text-xl); font-weight: var(--weight-semibold); }
  .pv-bar small { display: block; font-size: var(--text-xs); font-weight: var(--weight-medium); color: var(--color-text-muted); }
  .pv-main { display: flex; flex-direction: column; gap: var(--space-8); padding: var(--space-6) var(--space-5) var(--space-12); }
  .pv-screen h2 { margin: 0 0 var(--space-3); font-size: var(--text-lg); font-weight: var(--weight-semibold); }
  .pv-row { display: flex; flex-wrap: wrap; align-items: flex-end; gap: var(--space-6); }
  .pv-dev { display: flex; flex-direction: column; align-items: center; gap: var(--space-2); margin: 0; }
  .pv-stage { position: relative; overflow: hidden; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg); background: var(--color-surface); cursor: zoom-in; }
  .pv-stage iframe, .pv-big iframe { position: absolute; top: 0; left: 0; border: 0; transform-origin: top left; background: var(--color-bg-app); }
  .pv-stage iframe { pointer-events: none; }
  .pv-dev figcaption { font-size: var(--text-xs); color: var(--color-text-muted); text-align: center; }
  .pv-dev figcaption b { display: block; font-size: var(--text-sm); color: var(--color-text); }
  .pv-open { display: inline-flex; align-items: center; gap: var(--space-1-5); min-height: var(--space-8); margin-top: var(--space-1); padding: 0 var(--space-3); border: 0; border-radius: var(--radius-full); font: inherit; font-size: var(--text-xs); font-weight: var(--weight-semibold); color: var(--color-text-link); background: var(--color-surface-muted); cursor: pointer; white-space: nowrap; }
  .pv-modal { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; background: var(--color-bg-app); }
  .pv-modal .pv-bar { position: static; }
  .pv-big-stage { position: relative; flex: 1; min-height: 0; display: grid; place-items: center; overflow: hidden; }
  .pv-big-stage.is-scrolling { place-items: start center; overflow: auto; }
  .pv-big-pad { padding: var(--space-8); }
  .pv-big { position: relative; overflow: hidden; border-radius: var(--radius-xl); box-shadow: var(--shadow-xl); }
  .pv-big iframe { pointer-events: auto; }
  .pv-empty { padding: var(--space-8); text-align: center; color: var(--color-text-muted); }
</style>
</head>
<body>
<header class="pv-bar">
  <h1>{{NAME}}<small>Antz Design System {{VERSION}} · prototype preview</small></h1>
  <div class="segmented segmented--xs" role="group" aria-label="Devices" id="pv-devices"></div>
  <div class="segmented segmented--xs" role="group" aria-label="Theme" id="pv-theme"></div>
  <div class="segmented segmented--xs" role="group" aria-label="Contrast" id="pv-contrast"></div>
</header>
<main class="pv-main" id="pv-main"><p class="pv-empty">Loading screens…</p></main>

<div class="pv-modal" id="pv-modal" role="dialog" aria-modal="true" aria-labelledby="pv-modal-title" hidden>
  <div class="pv-bar">
    <h1 id="pv-modal-title"></h1>
    <div class="segmented segmented--xs" role="group" aria-label="Device" id="pv-m-devices"></div>
    <div class="segmented segmented--xs" role="group" aria-label="Zoom" id="pv-zoom"></div>
    <button class="icon-btn" type="button" aria-label="Close the preview" id="pv-close"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6L18 18M18 6L6 18"/></svg></button>
  </div>
  <div class="pv-big-stage" id="pv-big-stage"><div class="pv-big-pad"><div class="pv-big" id="pv-big"></div></div></div>
</div>

<script>
(function () {
  var DEV = { mobile: ['Mobile', 390, 844], 'tablet-p': ['Tablet portrait', 820, 1180], 'tablet-l': ['Tablet landscape', 1180, 820], desktop: ['Desktop', 1440, 900] };
  var state = { filter: 'all', theme: '', contrast: '', screens: [], open: null, zoom: 'fit', returnTo: null };
  function $(s, r) { return (r || document).querySelector(s); }
  function seg(el, opts, cur, on) {
    el.innerHTML = opts.map(function (o) { return '<button type="button" aria-pressed="' + (o[0] === cur) + '" data-v="' + o[0] + '">' + o[1] + '</button>'; }).join('');
    el.onclick = function (e) { var b = e.target.closest('button'); if (b) on(b.dataset.v); };
  }
  function applyMode(frame) {
    try { var h = frame.contentDocument.documentElement;
      if (state.theme) h.dataset.theme = state.theme; else delete h.dataset.theme;
      if (state.contrast) h.dataset.contrast = state.contrast; else delete h.dataset.contrast;
    } catch (e) { /* another origin: open the preview through antz.mjs preview */ }
  }
  function allFrames() { return Array.prototype.slice.call(document.querySelectorAll('iframe')); }
  function frame(src, w, h, s, title) {
    var f = document.createElement('iframe');
    f.src = src; f.title = title; f.width = w; f.height = h; f.loading = 'lazy'; f.tabIndex = -1;
    f.style.width = w + 'px'; f.style.height = h + 'px'; f.style.transform = 'scale(' + s + ')';
    f.addEventListener('load', function () { applyMode(f); });
    return f;
  }
  function render() {
    var main = $('#pv-main');
    if (!state.screens.length) { main.innerHTML = '<p class="pv-empty">No screens yet. Ask /systemprototype to add one.</p>'; return; }
    main.innerHTML = '';
    state.screens.forEach(function (sc, i) {
      var sec = document.createElement('section'); sec.className = 'pv-screen';
      sec.innerHTML = '<h2>' + sc.title + '</h2><div class="pv-row"></div>';
      var row = $('.pv-row', sec);
      var shown = (sc.devices || Object.keys(DEV)).filter(function (d) { return state.filter === 'all' || state.filter === d; });
      // One scale for the whole row, so the devices keep their real proportions (as in the docs).
      var cs = getComputedStyle(main), inner = main.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
      // Same scale for every row: as if all four devices sat side by side (a single device: its own width).
      var total = state.filter === 'all' ? Object.keys(DEV).reduce(function (n, d) { return n + DEV[d][1]; }, 0) : DEV[state.filter][1], avail = Math.max(320, inner - 24 * (shown.length - 1) - 8);
      var rowScale = Math.min(1, avail / total);
      shown.forEach(function (d) {
        var dv = DEV[d], s = Math.floor(rowScale * 1000) / 1000;
        var fig = document.createElement('figure'); fig.className = 'pv-dev';
        var stage = document.createElement('div'); stage.className = 'pv-stage';
        stage.style.width = Math.round(dv[1] * s) + 'px'; stage.style.height = Math.round(dv[2] * s) + 'px';
        stage.appendChild(frame(sc.file, dv[1], dv[2], s, sc.title + ', ' + dv[0]));
        fig.appendChild(stage);
        var cap = document.createElement('figcaption');
        cap.innerHTML = '<b>' + dv[0] + '</b>' + dv[1] + ' × ' + dv[2] + '<br>';
        var btn = document.createElement('button'); btn.type = 'button'; btn.className = 'pv-open'; btn.textContent = 'Open larger';
        btn.setAttribute('aria-label', 'Open ' + sc.title + ', ' + dv[0] + ', larger');
        btn.onclick = function () { openBig(i, d, btn); };
        stage.onclick = function () { openBig(i, d, btn); };
        cap.appendChild(btn); fig.appendChild(cap); row.appendChild(fig);
      });
      main.appendChild(sec);
    });
  }
  function openBig(i, d, from) {
    state.open = { i: i, d: d }; state.returnTo = from;
    $('#pv-modal').hidden = false; document.documentElement.style.overflow = 'hidden';
    layoutBig(); $('#pv-close').focus();
  }
  function closeBig() {
    $('#pv-modal').hidden = true; document.documentElement.style.overflow = ''; $('#pv-big').innerHTML = '';
    if (state.returnTo) state.returnTo.focus();
  }
  function layoutBig() {
    var sc = state.screens[state.open.i], dv = DEV[state.open.d], stage = $('#pv-big-stage'), box = $('#pv-big');
    $('#pv-modal-title').textContent = sc.title + ' · ' + dv[0] + ' ' + dv[1] + ' × ' + dv[2];
    seg($('#pv-m-devices'), (sc.devices || Object.keys(DEV)).map(function (k) { return [k, DEV[k][0]]; }), state.open.d, function (v) { state.open.d = v; layoutBig(); });
    seg($('#pv-zoom'), [['fit', 'Fit'], ['1', '100%'], ['1.5', '150%']], state.zoom, function (v) { state.zoom = v; layoutBig(); });
    var s = state.zoom === 'fit' ? Math.min((stage.clientWidth - 64) / dv[1], (stage.clientHeight - 64) / dv[2]) : parseFloat(state.zoom);
    s = Math.max(0.2, s);
    box.innerHTML = ''; box.style.width = Math.round(dv[1] * s) + 'px'; box.style.height = Math.round(dv[2] * s) + 'px';
    box.appendChild(frame(sc.file, dv[1], dv[2], s, sc.title + ', ' + dv[0]));
    stage.classList.toggle('is-scrolling', state.zoom !== 'fit');
  }
  $('#pv-close').onclick = closeBig;
  document.addEventListener('keydown', function (e) {
    if ($('#pv-modal').hidden) return;
    if (e.key === 'Escape') { e.preventDefault(); closeBig(); }
    if (e.key === 'Tab') {
      var f = Array.prototype.slice.call($('#pv-modal').querySelectorAll('button')); if (!f.length) return;
      if (e.shiftKey && document.activeElement === f[0]) { e.preventDefault(); f[f.length - 1].focus(); }
      else if (!e.shiftKey && document.activeElement === f[f.length - 1]) { e.preventDefault(); f[0].focus(); }
    }
  });
  window.addEventListener('resize', function () { if (!$('#pv-modal').hidden) layoutBig(); });
  function bars() {
    seg($('#pv-devices'), [['all', 'All sizes']].concat(Object.keys(DEV).map(function (k) { return [k, DEV[k][0]]; })), state.filter, function (v) { state.filter = v; bars(); render(); });
    seg($('#pv-theme'), [['', 'Auto'], ['light', 'Light'], ['dark', 'Dark']], state.theme, function (v) { state.theme = v; if (v) document.documentElement.dataset.theme = v; else delete document.documentElement.dataset.theme; bars(); allFrames().forEach(applyMode); });
    seg($('#pv-contrast'), [['', 'Standard'], ['high', 'High contrast']], state.contrast, function (v) { state.contrast = v; if (v) document.documentElement.dataset.contrast = v; else delete document.documentElement.dataset.contrast; bars(); allFrames().forEach(applyMode); });
  }
  bars();
  fetch('screens.json', { cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (j) { state.screens = j.screens || []; render(); })
    .catch(function () { $('#pv-main').innerHTML = '<p class="pv-empty">Open this preview through the helper (node antz.mjs preview), not as a file, so the screens can load.</p>'; });
})();
</script>
</body>
</html>
