<!doctype html>
<html lang="en" data-root=".">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theme tester frame · Antz Design System</title>
<link rel="icon" href="data:,">
<script>
  // Mode comes from the query string, set before first paint.
  (function () {
    var q = new URLSearchParams(location.search), d = document.documentElement;
    var t = q.get('theme'); if (t === 'light' || t === 'dark') d.dataset.theme = t;
    if (q.get('contrast') === 'high') d.dataset.contrast = 'high'; else d.dataset.contrast = 'standard';
    if (q.get('density') === 'compact') d.dataset.density = 'compact';
    if (q.get('rtl') === '1') d.dir = 'rtl';
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tokens.css?v=100beta1">
<link rel="stylesheet" href="components.css?v=100beta1">
<link rel="stylesheet" href="assets/site.css?v=100beta1">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; background: var(--color-bg-app); }
  .frame-host { width: 100vw; height: 100vh; }
  .frame-host > .shell { height: 100%; }
  .kit { height: 100%; overflow-y: auto; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
  .kit > * { flex: none; }
  .kit__row { display: flex; flex-wrap: wrap; gap: var(--space-2-5); align-items: center; }
  .kit__grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 260px), 1fr)); gap: var(--space-3); }
  .rec { height: 100%; display: grid; grid-template-columns: minmax(0, 1fr) auto; }
  .rec__list { overflow-y: auto; padding: var(--space-6); display: flex; flex-direction: column; gap: var(--space-4); }
  .rec .drawer--inline { border-radius: 0; height: 100vh; }
  @media (max-width: 899px) { .rec { grid-template-columns: 1fr; } .rec .drawer--inline { position: fixed; inset: 0; max-width: none; z-index: var(--z-drawer); } }
</style>
</head>
<body data-page="tester-frame">
<div class="frame-host shell-host" id="host"><div class="empty" style="height:100%;justify-content:center"><span class="spinner"></span>Loading screen…</div></div>

<template id="screen-kit">
  <div class="kit">
    <section class="hero-band wash" data-wash-target><div><span class="t-overline">Antz Design System</span><h4 class="hero-band__title">Every species, every site</h4><p class="hero-band__sub">The core components in the current mode.</p></div><div class="hero-band__stats"><div><b class="num">2,411</b><small>Species</small></div><div><b class="num">110,020</b><small>Animals</small></div><div><b class="num">9</b><small>Sites</small></div></div></section>
    <div class="card"><b class="card__title">Actions</b>
      <div class="kit__row"><button class="btn btn--primary" type="button"><svg class="icon"><use href="#i-plus"/></svg>Add animal</button><button class="btn btn--secondary" type="button">Secondary</button><button class="btn btn--outline-brand" type="button">Outlined</button><button class="btn btn--text" type="button">Text</button><button class="btn btn--tertiary" type="button">Tertiary</button><button class="btn btn--danger" type="button">Delete</button><button class="btn btn--primary" type="button" disabled>Disabled</button></div>
      <div class="kit__row"><button class="icon-btn" type="button" aria-label="Edit"><svg class="icon"><use href="#i-pencil"/></svg></button><button class="icon-btn icon-btn--solid" type="button" aria-label="Add"><svg class="icon"><use href="#i-plus"/></svg></button><button class="fab" type="button" aria-label="Quick add"><svg class="icon"><use href="#i-plus"/></svg></button><span class="tile-module"><svg class="icon"><use href="#i-paw"/></svg></span><span class="tile-module tile-module--teal-green"><svg class="icon"><use href="#i-home"/></svg></span><span class="tile-module tile-module--cyan-navy"><svg class="icon"><use href="#i-heart"/></svg></span><span class="tile-module tile-module--coral-red"><svg class="icon"><use href="#i-alert"/></svg></span></div>
    </div>
    <div class="kit__grid">
      <div class="card"><b class="card__title">Status</b><div class="kit__row"><span class="status status--success">Healthy</span><span class="status status--caution">Pending</span><span class="status status--warning">Overdue</span><span class="status status--danger">Critical</span><span class="status status--info">In transfer</span><span class="status status--secondary">Quarantine</span><span class="status status--tertiary">Archived</span><span class="status status--live status--success">Live</span></div>
        <div class="alert alert--caution"><svg class="icon"><use href="#i-clock"/></svg><div><b>16 approvals waiting</b>Transfers and necropsy requests need a decision.</div></div></div>
      <div class="card"><b class="card__title">Fields</b><label class="field"><span class="field__label">Animal name <span class="req">*</span></span><input class="input" placeholder="e.g. Bheem"></label><label class="field"><span class="field__label">Weight (kg)</span><input class="input" value="218.4" aria-invalid="true"><span class="field__error"><svg class="icon"><use href="#i-alert"/></svg>Higher than the last weigh-in by 22%</span></label>
        <div class="kit__row"><label class="check"><input type="checkbox" checked> Notify vet</label><label class="check"><input type="radio" name="kr" checked> Male</label><label class="check"><input type="radio" name="kr"> Female</label><span class="switch"><input type="checkbox" checked aria-label="Visible"><span></span></span></div></div>
      <div class="card"><b class="card__title">Navigation and progress</b><div class="segmented segmented--line" role="tablist"><button role="tab" aria-selected="true" type="button">All 42</button><button role="tab" aria-selected="false" type="button">Pending 16</button><button role="tab" aria-selected="false" type="button">Done 26</button></div>
        <div class="segmented"><button type="button" aria-pressed="true">Day</button><button type="button" aria-pressed="false">Week</button><button type="button" aria-pressed="false">Month</button></div>
        <div class="progress"><span style="width:62%"></span></div><div class="kit__row"><span class="chip" aria-pressed="true">Mammals</span><span class="chip">Birds</span><span class="chip">Reptiles</span><span class="count count--accent">4</span><span class="tag">New</span></div></div>
      <div class="card card--navy"><span class="card__meta">Hospital · under care now</span><span class="t-stat num">41</span><span class="card__meta">29 ours · 12 from outside</span></div>
      <article class="card wash wash--celebrate"><span class="tag tag--soft">Announcement</span><b class="card__title">Three red panda cubs born at North site</b><span class="card__meta">Keeper team · today</span></article>
      <div class="card wash wash--calm"><div class="empty"><span class="tile-icon tile-icon--lg" style="--c:var(--hue-teal-ink)"><svg class="icon"><use href="#i-clipboard"/></svg></span><b>No observations yet</b><span>Notes from the enclosure appear here.</span></div></div>
    </div>
    <div class="card"><b class="card__title">Table</b><div class="table-wrap"><table class="table"><thead><tr><th>Animal</th><th>Species</th><th>Enclosure</th><th>Status</th><th class="num">Weight</th></tr></thead><tbody>
      <tr><td><b>Bheem</b></td><td>Bengal tiger</td><td>T4</td><td><span class="status status--success">Healthy</span></td><td class="num">218.4 kg</td></tr>
      <tr><td><b>Mira</b></td><td>Red panda</td><td>P2</td><td><span class="status status--caution">Monitoring</span></td><td class="num">5.1 kg</td></tr>
      <tr><td><b>Kavi</b></td><td>Indian rhinoceros</td><td>R1</td><td><span class="status status--danger">Critical</span></td><td class="num">2,140 kg</td></tr></tbody></table></div></div>
  </div>
</template>

<template id="screen-record">
  <div class="rec">
    <div class="rec__list">
      <section class="hero-band wash" data-wash-target><div><span class="t-overline">Pharmacy · Stock</span><h4 class="hero-band__title">Medicines</h4><p class="hero-band__sub">North site pharmacy · 312 products</p></div><button class="btn btn--primary" type="button"><svg class="icon"><use href="#i-plus"/></svg>Add product</button></section>
      <div class="card"><div class="kit__row" style="justify-content:space-between"><div class="search" style="flex:1 1 240px"><svg class="icon"><use href="#i-search"/></svg><input placeholder="Search products" aria-label="Search products"></div><button class="btn btn--outline" type="button"><svg class="icon"><use href="#i-filter"/></svg>Filter <span class="count">2</span></button></div>
      <div class="table-wrap"><table class="table"><thead><tr><th>Product</th><th>Batch</th><th>Expiry</th><th>Stock</th><th></th></tr></thead><tbody>
        <tr><td><b>Meloxicam 1.5 mg/ml</b></td><td>MX-2291</td><td>Mar 2027</td><td><span class="status status--success">142</span></td><td><button class="icon-btn icon-btn--sm icon-btn--ghost" type="button" aria-label="More"><svg class="icon"><use href="#i-more-v"/></svg></button></td></tr>
        <tr class="is-selected"><td><b>Enrofloxacin 50 mg</b></td><td>EF-1180</td><td>Jan 2027</td><td><span class="status status--caution">18 · low</span></td><td><button class="icon-btn icon-btn--sm icon-btn--ghost" type="button" aria-label="More"><svg class="icon"><use href="#i-more-v"/></svg></button></td></tr>
        <tr><td><b>Ivermectin 1%</b></td><td>IV-0042</td><td>Dec 2026</td><td><span class="status status--danger">Expiring</span></td><td><button class="icon-btn icon-btn--sm icon-btn--ghost" type="button" aria-label="More"><svg class="icon"><use href="#i-more-v"/></svg></button></td></tr>
        <tr><td><b>Vitamin E + selenium</b></td><td>VE-7731</td><td>Aug 2027</td><td><span class="status status--success">64</span></td><td><button class="icon-btn icon-btn--sm icon-btn--ghost" type="button" aria-label="More"><svg class="icon"><use href="#i-more-v"/></svg></button></td></tr></tbody></table></div></div>
    </div>
    <aside class="drawer drawer--inline" aria-label="Edit product">
      <div class="drawer__head"><h4 class="drawer__title">Enrofloxacin 50 mg</h4><button class="icon-btn icon-btn--sm" type="button" aria-label="Close"><svg class="icon"><use href="#i-x"/></svg></button></div>
      <div class="drawer__body">
        <div class="alert alert--caution"><svg class="icon"><use href="#i-alert"/></svg><div><b>Low stock</b>18 left. Reorder point is 25.</div></div>
        <label class="field"><span class="field__label">Product name</span><input class="input" value="Enrofloxacin 50 mg"></label>
        <label class="field"><span class="field__label">Reorder point</span><input class="input" value="25"></label>
        <label class="field"><span class="field__label">Notes <span class="opt">optional</span></span><textarea class="textarea" rows="3">Keep away from light.</textarea></label>
        <label class="check"><input type="checkbox" checked> Alert the pharmacist when below the reorder point</label>
      </div>
      <div class="drawer__foot"><button class="btn btn--outline" type="button">Cancel</button><button class="btn btn--primary" type="button">Save changes</button></div>
    </aside>
  </div>
</template>

<script src="assets/site.js?v=100beta1"></script>
<script>
(function () {
  var q = new URLSearchParams(location.search);
  var screen = q.get('screen') || 'kit', wash = q.get('wash') || 'primary';
  var host = document.getElementById('host');
  function applyWash(root) {
    root.querySelectorAll('[data-wash-target]').forEach(function (el) {
      if (wash === 'none') el.classList.remove('wash'); else el.classList.add('wash--' + wash);
    });
  }
  function done() { applyWash(host); document.documentElement.dataset.ready = '1'; }
  var local = document.getElementById('screen-' + screen);
  if (local) { host.innerHTML = ''; host.appendChild(local.content.cloneNode(true)); done(); return; }
  fetch('pages/screen-' + screen + '.html').then(function (r) { return r.text(); }).then(function (html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var tpl = doc.querySelector('template');
    host.innerHTML = '';
    if (!tpl) { host.innerHTML = '<div class="empty">Screen not found.</div>'; return; }
    host.appendChild(document.importNode(tpl.content, true));
    if (wash !== 'none') {
      var scroll = host.querySelector('.screen__scroll');
      if (scroll && screen === 'home') {
        var band = document.createElement('section');
        band.className = 'hero-band wash wash--' + wash; band.style.marginBottom = 'var(--space-4)';
        band.innerHTML = '<div><span class="t-overline">Species management</span><h4 class="hero-band__title">Every species, every site</h4></div><div class="hero-band__stats"><div><b class="num">2,411</b><small>Species</small></div><div><b class="num">110,020</b><small>Animals</small></div></div>';
        var head = scroll.querySelector('.page-head');
        if (head && head.nextSibling) scroll.insertBefore(band, head.nextSibling); else scroll.prepend(band);
      }
    }
    done();
  }).catch(function () { host.innerHTML = '<div class="empty"><b>Open through a local server</b>Run python3 -m http.server in the design system folder.</div>'; });
})();
</script>
</body>
</html>
